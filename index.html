*,:after,:before{box-sizing:border-box;backface-visibility:hidden;margin:0;padding:0;font-family:'Helvetica Neue',Helvetica,Arial,sans-serif}

.mini-player{position:fixed;z-index:500;cursor:grab;user-select:none;-webkit-user-select:none;transition:transform .2s,opacity .3s;width:.8rem;height:.8rem}
.mini-player:active{cursor:grabbing}
.mini-player.hidden{display:none}
.mini-player.no-interaction{opacity:0;pointer-events:none;visibility:hidden}
.mini-player-vinyl{width:100%;height:100%;border-radius:50%;background:radial-gradient(circle at 30% 30%,#2a2a2a 0%,#111 40%,#0a0a0a 70%,#000 100%);box-shadow:0 .04rem .2rem rgba(0,0,0,.6),0 0 0 1px rgba(255,255,255,.06) inset;position:relative;overflow:hidden;transition:all .35s cubic-bezier(.25,.46,.45,.94)}
.mini-player-vinyl::before{content:'';position:absolute;inset:0;border-radius:50%;background:repeating-radial-gradient(circle at 50% 50%,transparent 0px,transparent 2px,rgba(255,255,255,.03) 2px,rgba(255,255,255,.03) 3px);pointer-events:none}
.mini-player-vinyl::after{content:'';position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 180deg at 50% 50%,transparent 0deg,rgba(255,255,255,.04) 30deg,transparent 60deg,rgba(255,255,255,.02) 90deg,transparent 120deg,rgba(255,255,255,.04) 150deg,transparent 180deg,rgba(255,255,255,.02) 210deg,transparent 240deg,rgba(255,255,.04) 270deg,transparent 300deg,rgba(255,255,255,.02) 330deg,transparent 360deg);pointer-events:none;mix-blend-mode:overlay}
.mini-player-vinyl-label{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:.28rem;height:.28rem;border-radius:50%;background-size:cover;background-position:center;box-shadow:0 0 0 1px rgba(255,255,255,.1),0 0 0 3px rgba(0,0,0,.4),0 0 8px rgba(0,0,0,.5) inset}
.mini-player-vinyl-hole{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:.06rem;height:.06rem;border-radius:50%;background:#000;box-shadow:0 0 0 1px rgba(255,255,255,.15) inset}
.mini-player-vinyl-shine{position:absolute;top:10%;left:15%;width:35%;height:25%;border-radius:50%;background:radial-gradient(ellipse at 30% 30%,rgba(255,255,255,.08) 0%,rgba(255,255,255,.03) 40%,transparent 70%);transform:rotate(-20deg);pointer-events:none;filter:blur(1px)}
.mini-player.playing .mini-player-vinyl{animation:miniVinylSpin 4s linear infinite}
.mini-player.paused .mini-player-vinyl{animation-play-state:paused}
@keyframes miniVinylSpin{to{transform:rotate(360deg)}}

.mini-player:hover .mini-player-vinyl{width:0;height:0;opacity:0;transform:scale(0)}
.mini-player-card{position:absolute;top:0;left:0;width:2.8rem;background:rgba(255,255,255,.06);backdrop-filter:blur(24px) saturate(180%);-webkit-backdrop-filter:blur(24px) saturate(180%);border-radius:.16rem;border:1px solid rgba(255,255,255,.2);box-shadow:inset 0 1px 0 rgba(255,255,255,.15),0 .08rem .4rem rgba(0,0,0,.5);padding:.16rem;opacity:0;transform:scale(.8) translateY(.1rem);pointer-events:none;transition:all .35s cubic-bezier(.25,.46,.45,.94);transform-origin:top left;overflow:hidden}
.mini-player:hover .mini-player-card{opacity:1;transform:scale(1) translateY(0);pointer-events:auto}
.mini-player-card-cover{position:relative;width:.72rem;height:.72rem;border-radius:.08rem;overflow:hidden;background:#1a1a1a;flex-shrink:0}
.mini-player-card-cover img{width:100%;height:100%;object-fit:cover;display:block}
.mini-player-card-header{display:flex;align-items:center;gap:.1rem;margin-bottom:.12rem}
.mini-player-card-meta{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center;gap:.04rem}
.mini-player-card-title{font-size:.13rem;color:#fff;font-weight:600;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.3}
.mini-player-card-artist{font-size:.1rem;color:rgba(255,255,255,.4);text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.2}
.mini-player-card-progress{width:100%;height:.04rem;background:rgba(255,255,255,.1);border-radius:.02rem;overflow:hidden;position:relative;cursor:none;margin-bottom:.06rem}
.mini-player-card-progress-bar{height:100%;background:#c4a35a;border-radius:.02rem;width:0%;transition:width .1s}
.mini-player-card-progress::after{content:'';position:absolute;top:50%;left:0%;transform:translate(-50%,-50%);width:.1rem;height:.1rem;background:#fff;border-radius:50%;opacity:0;transition:opacity .2s}
.mini-player:hover .mini-player-card-progress::after{opacity:1}
.mini-player-card-time-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:.12rem}
.mini-player-card-time{font-size:.09rem;color:rgba(255,255,255,.35);font-variant-numeric:tabular-nums}
.mini-player-card-controls{display:flex;align-items:center;justify-content:center;gap:.16rem}
.mini-player-card-btn{width:.28rem;height:.28rem;background:transparent;border:none;border-radius:50%;cursor:none;display:flex;align-items:center;justify-content:center;transition:all .2s;color:rgba(255,255,255,.5);padding:0;flex-shrink:0}
.mini-player-card-btn:hover{color:rgba(255,255,255,.85);transform:scale(1.1)}
.mini-player-card-btn svg{width:.18rem;height:.18rem;fill:currentColor}
.mini-player-card-play-btn{width:.36rem;height:.36rem;background:#fff;border:none;border-radius:50%;cursor:none;display:flex;align-items:center;justify-content:center;transition:all .2s;color:#000;padding:0;flex-shrink:0}
.mini-player-card-play-btn:hover{background:rgba(255,255,255,.9);transform:scale(1.05)}
.mini-player-card-play-btn svg{width:.2rem;height:.2rem;fill:currentColor}
.mini-player-close{position:absolute;top:.08rem;right:.08rem;width:.2rem;height:.2rem;border-radius:50%;background:rgba(255,255,255,.1);border:none;color:rgba(255,255,255,.6);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .2s;padding:0;z-index:10}
.mini-player-close:hover{background:rgba(255,255,255,.2);color:#fff}
.mini-player-close svg{width:.1rem;height:.1rem;fill:currentColor}

#loading{position:fixed;top:0;left:0;width:100%;height:100%;z-index:9999;background:#000;transition:opacity .8s,visibility .8s}
#loading.hidden{opacity:0;visibility:hidden;pointer-events:none}
#loading .loadImg{position:absolute;top:50%;left:50%;width:3.6rem;height:3.6rem;margin-top:-1.8rem;margin-left:-1.8rem;animation:spin 2s linear 1 forwards}
#loading .loadImg.zoomOut{animation:zoomFade .9s cubic-bezier(.25,.1,.25,1) forwards}
#loading .loadMsg{position:absolute;bottom:.65rem;left:.35rem}
#loading .loadMsg p{font-size:.12rem;color:rgba(255,255,255,.5);font-style:italic}
#loading .progressWrap{position:absolute;bottom:.28rem;left:.35rem}
#loading .progressBar{width:2.4rem;height:.02rem;background:rgba(255,255,255,.1);border-radius:.01rem;overflow:hidden;display:block}
#loading .progressBar .fill{height:100%;width:0%;background:#fff;transition:width .1s linear;border-radius:.01rem}
#loading .progressNum{font-size:.24rem;color:rgba(255,255,255,.5);margin-top:.06rem;font-family:Helvetica,Arial,sans-serif;font-weight:300}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes zoomFade{0%{transform:scale(1);opacity:1}100%{transform:scale(4);opacity:0}}

#cursor{position:fixed;pointer-events:none;z-index:9998;width:32px;height:32px;transform:translate(-50%,-50%);transition:none;will-change:left,top}

header.scrolled .pc-nav{background:rgba(255,255,255,.12);backdrop-filter:blur(24px) saturate(180%);-webkit-backdrop-filter:blur(24px) saturate(180%);padding:.1rem .5rem;border:1px solid rgba(255,255,255,.22);box-shadow:inset 0 1px 0 rgba(255,255,255,.2),0 .04rem .2rem rgba(0,0,0,.25)}

header .headerActions{display:flex;align-items:center;gap:.12rem}

header.dimmed .navItems{opacity:.25;transition:opacity .45s}
header.dimmed .headerActions{opacity:.25;transition:opacity .45s}
header .navItems{transition:opacity .45s}
header .headerActions{transition:opacity .45s}

header .pc-nav .nav-left-group{display:flex;align-items:center;gap:0;transition:gap .4s cubic-bezier(.25,.46,.45,.94)}
header .pc-nav .nav-center{flex:1;display:flex;justify-content:center;transition:all .4s ease}

header.nav-collapsed .pc-nav{gap:0;padding:.12rem .14rem;transition:all .5s cubic-bezier(.25,.46,.45,.94);width:auto;min-width:0}

header.nav-collapsed{min-width:0;width:auto;left:.3rem;transform:translateX(0);right:auto}
header .navToggle{display:flex;align-items:center;justify-content:center;background:none;border:none;color:rgba(255,255,255,.35);cursor:none;padding:.06rem;margin-left:.12rem;opacity:0;transform:translateX(-.1rem);pointer-events:none;transition:all .35s cubic-bezier(.25,.46,.45,.94)}
header .navToggle:hover{color:#fff}
header .navToggle svg{width:.22rem;height:.22rem;fill:currentColor}

@keyframes breatheGlow{0%,100%{color:rgba(255,255,255,.25);filter:drop-shadow(0 0 0 transparent)}50%{color:rgba(255,255,255,.9);filter:drop-shadow(0 0 .08rem rgba(255,255,255,.6))}}

var bannerData = {
    topics: ['VipenOnline'],
    notes:  ['DesignbyJah72'],
    bgType: ['video', 'image', 'video', 'video'],
    bgImage: ['', 'banner/disctrack.png', '', ''],
    bgVideoSrc: ['banner/bg_opt.mp4', 'banner/bg.mp4', 'banner/bg.mp4', 'banner/bg.mp4'],
    current: 0,
    textSlideIndex: 0
};

var isAnimating = false;

function changeSlide(index){
    if(isAnimating) return;
    var bgTotal = bannerData.bgType.length;
    var newIndex = (typeof index === 'number') ? index : ((bannerData.current + index + bgTotal) % bgTotal);
    if(newIndex === bannerData.current) return;
    isAnimating = true;

    stopProgress();
    bannerData.current = newIndex;
    updateDots();
    startProgress();

    if(autoSlideInterval){
        clearInterval(autoSlideInterval);
        autoSlideInterval = setInterval(function(){
            goToNextSlide();
        }, slideDuration);
    }

    var msgEl = document.querySelector('#banner .msg');
    var topicLine = document.getElementById('topicLine');
    var noteLine = document.getElementById('noteLine');
    var h2 = topicLine.querySelector('h2');
    var h3 = noteLine.querySelector('h3');
    var bgVideo = document.getElementById('bgVideo');
    var bannerImgBg = document.getElementById('bannerImgBg');

    msgEl.style.opacity = '0';

    slideChangeTimeout = setTimeout(function(){
        if(bannerData.current === 0){
            bannerData.textSlideIndex = (bannerData.textSlideIndex + 1) % bannerData.topics.length;
            h2.textContent = bannerData.topics[bannerData.textSlideIndex];
            h3.textContent = bannerData.notes[bannerData.textSlideIndex];
            msgEl.style.display = '';
        } else {
            msgEl.style.display = 'none';
        }

        var type = bannerData.bgType[bannerData.current];
        if(type === 'video'){
            if(bgVideo){
                var newSrc = bannerData.bgVideoSrc[bannerData.current];
                if(bgVideo.src.indexOf(newSrc) === -1 && bgVideo.currentSrc.indexOf(newSrc) === -1){
                    bgVideo.src = newSrc;
                    bgVideo.load();
                }
                bgVideo.style.display = '';
                var playPromise = bgVideo.play();
                if(playPromise !== undefined){
                    playPromise.catch(function(){});
                }
            }
            if(bannerImgBg) bannerImgBg.style.display = 'none';
        } else if(type === 'image'){
            if(bgVideo){
                bgVideo.pause();
                bgVideo.style.display = 'none';
            }
            if(bannerImgBg){
                bannerImgBg.style.backgroundImage = 'url(' + bannerData.bgImage[bannerData.current] + ')';
                bannerImgBg.style.display = '';
            }
        } else {
            if(bgVideo){
                bgVideo.pause();
                bgVideo.style.display = 'none';
            }
            if(bannerImgBg) bannerImgBg.style.display = 'none';
        }

        if(bannerData.current === 0){
            msgEl.style.opacity = '1';
        }

        slideChangeTimeout = setTimeout(function(){
            isAnimating = false;
            slideChangeTimeout = null;
        }, 50);
    }, 200);
}

function updateDots(){
    var dots = document.querySelectorAll('#slideDots .dot');
    dots.forEach(function(dot, i){
        if(i === bannerData.current){
            dot.classList.add('active');
        } else {
            dot.classList.remove('active');
        }
    });
}

var dots = document.querySelectorAll('#slideDots .dot');
dots.forEach(function(dot){
    dot.addEventListener('click', function(){
        var idx = parseInt(this.getAttribute('data-index'));
        changeSlide(idx);
    });
});

var autoSlideInterval = null;
var progressInterval = null;
var progressAnimFrame = null;
var slideDuration = 5000;
var progressStartTime = 0;
var slideChangeTimeout = null;

function startProgress(){
    stopProgress();
    var activeDot = document.querySelector('#slideDots .dot.active');
    if(!activeDot) return;
    var progressBar = activeDot.querySelector('.dot-progress');
    if(!progressBar) return;
    progressBar.style.width = '0%';
    progressStartTime = performance.now();
    function tick(now){
        var elapsed = now - progressStartTime;
        var pct = Math.min((elapsed / slideDuration) * 100, 100);
        progressBar.style.width = pct + '%';
        if(pct < 100){
            progressAnimFrame = requestAnimationFrame(tick);
        }
    }
    progressAnimFrame = requestAnimationFrame(tick);
}

function stopProgress(){
    if(progressAnimFrame){
        cancelAnimationFrame(progressAnimFrame);
        progressAnimFrame = null;
    }
    var allBars = document.querySelectorAll('#slideDots .dot .dot-progress');
    allBars.forEach(function(bar){ bar.style.width = '0%'; });
}

function goToNextSlide(){
    var nextIdx = (bannerData.current + 1) % bannerData.bgType.length;
    changeSlide(nextIdx);
}

function startAutoSlide(){
    stopAutoSlide();
    startProgress();
    autoSlideInterval = setInterval(function(){
        goToNextSlide();
    }, slideDuration);
}

function stopAutoSlide(){
    if(autoSlideInterval){
        clearInterval(autoSlideInterval);
        autoSlideInterval = null;
    }
    if(slideChangeTimeout){
        clearTimeout(slideChangeTimeout);
        slideChangeTimeout = null;
    }
    stopProgress();
}

var bgm = document.getElementById('bgm');
var musicOn = true;

function playBgm(){
    if(!bgm) return;
    if(bgm.readyState < 2){
        bgm.load();
    }
    bgm.volume = 0.5;
    var playPromise = bgm.play();
    if(playPromise !== undefined){
        playPromise.then(function(){
            musicOn = true;
        }).catch(function(err){
            musicOn = false;
        });
    }
}

function pauseBgm(){
    if(!bgm) return;
    bgm.pause();
    musicOn = false;
}

function tryAutoPlay(){
    if(bgm && bgm.paused && !musicOn){
        playBgm();
    }
}

if(bgm){
    bgm.addEventListener('canplaythrough', function(){
        if(!musicOn){
            playBgm();
        }
    });
}

    var lightbox = document.getElementById('actionImageLightbox');
    if (lightbox) lightbox.classList.remove('active');
    actionLightboxCurrentPost = null;
}

function navigateLightbox(dir) {
    if (!actionLightboxCurrentPost || !actionLightboxCurrentPost.images) return;
    var total = actionLightboxCurrentPost.images.length;
    actionLightboxCurrentIndex = (actionLightboxCurrentIndex + dir + total) % total;
    var img = document.getElementById('actionLightboxImg');
    var counter = document.getElementById('actionLightboxCounter');
    if (img) img.src = actionLightboxCurrentPost.images[actionLightboxCurrentIndex];
    if (counter) counter.textContent = (actionLightboxCurrentIndex + 1) + ' / ' + total;
}

function bindActionInteractions() {
    var likeBtns = document.querySelectorAll('.action-post-action-btn.like-btn');
    likeBtns.forEach(function(btn) {
        btn.addEventListener('click', function() {
            var postId = parseInt(this.getAttribute('data-post-id'), 10);
            var post = actionFeed.find(function(p) { return p.id === postId; });
            if (post) {
                post.isLiked = !post.isLiked;
                post.likes += post.isLiked ? 1 : -1;
                this.classList.toggle('liked');
                var svg = this.querySelector('svg');
                var postEl = document.querySelector('.action-post[data-post-id="' + postId + '"]');
                var likesInfo = postEl ? postEl.querySelector('.action-post-likes-info') : null;
                if (post.isLiked) {
                    svg.setAttribute('fill', '#ed4956');
                    svg.setAttribute('stroke', '#ed4956');
                } else {
                    svg.setAttribute('fill', 'none');
                    svg.setAttribute('stroke', 'currentColor');
                }
                if (likesInfo) {
                    likesInfo.textContent = post.likes > 0 ? post.likes.toLocaleString() + ' likes' : 'Be the first to like';
                    if (post.isLiked) {
                        likesInfo.classList.remove('hidden');

    var imgWraps = document.querySelectorAll('.action-post-img-wrap');

        wrap.addEventListener('click', function() {

            var imgIndex = parseInt(this.getAttribute('data-img-index'), 10);
            openActionLightbox(postId, imgIndex);
        });
    });

    var lightboxClose = document.getElementById('actionLightboxClose');
    if (lightboxClose) {
        lightboxClose.addEventListener('click', closeActionLightbox);
    }

    var lightboxPrev = document.getElementById('actionLightboxPrev');
    if (lightboxPrev) {
        lightboxPrev.addEventListener('click', function(e) { e.stopPropagation(); navigateLightbox(-1); });
    }

    var lightboxNext = document.getElementById('actionLightboxNext');
    if (lightboxNext) {
        lightboxNext.addEventListener('click', function(e) { e.stopPropagation(); navigateLightbox(1); });
    }

    var lightbox = document.getElementById('actionImageLightbox');
    if (lightbox) {
        lightbox.addEventListener('click', function(e) {
            if (e.target === lightbox) closeActionLightbox();
        });
    }

    document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape') closeActionLightbox();
        if (e.key === 'ArrowLeft' && actionLightboxCurrentPost) navigateLightbox(-1);
        if (e.key === 'ArrowRight' && actionLightboxCurrentPost) navigateLightbox(1);
    });

    var commentBtns = document.querySelectorAll('.action-post-action-btn.comment-btn');
    commentBtns.forEach(function(btn) {
        btn.addEventListener('click', function() {
            var postId = parseInt(this.getAttribute('data-post-id'), 10);

            if (postEl) {
                var inputArea = postEl.querySelector('.action-post-comment-input-area');
                if (inputArea) {

                        var input = postEl.querySelector('.action-post-comment-input');

                    }
                }
            }
        });
    });

    var commentSubmits = document.querySelectorAll('.action-post-comment-submit');
    commentSubmits.forEach(function(btn) {
        btn.addEventListener('click', function() {
            var postId = parseInt(this.getAttribute('data-post-id'), 10);
            var postEl = document.querySelector('.action-post[data-post-id="' + postId + '"]');
            var input = postEl ? postEl.querySelector('.action-post-comment-input') : null;
            if (input && input.value.trim()) {
                var post = actionFeed.find(function(p) { return p.id === postId; });
                if (post) {
                    if (!post.commentList) post.commentList = [];
                    post.commentList.push({ user: 'Me', text: input.value.trim() });
                    post.comments = post.commentList.length;
                    var commentsContainer = postEl.querySelector('.action-post-comments');
                    if (commentsContainer) {
                        commentsContainer.innerHTML = buildActionPostComments(post);
                        bindCommentMoreClicks();
                    }

                }

        });
    });

    var commentInputs = document.querySelectorAll('.action-post-comment-input');
    commentInputs.forEach(function(input) {
        input.addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && this.value.trim()) {
                var postId = parseInt(this.getAttribute('data-post-id'), 10);
                var postEl = document.querySelector('.action-post[data-post-id="' + postId + '"]');

    var shareBtns = document.querySelectorAll('.action-post-more-btn.share-btn');
    shareBtns.forEach(function(btn) {
        btn.addEventListener('click', function(e) {
            e.stopPropagation();
            var postId = parseInt(this.getAttribute('data-post-id'), 10);
            var link = window.location.origin + window.location.pathname + '#/action/post/' + postId;
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(link).then(function() {
                    showCopiedToast();
                }).catch(function() {
                    fallbackCopyAndToast(link);
                });
            } else {
                fallbackCopyAndToast(link);
            }
        });
    });
}

function fallbackCopyAndToast(text) {
    var textarea = document.createElement('textarea');
    textarea.value = text;
    textarea.style.position = 'fixed';
    textarea.style.opacity = '0';
    document.body.appendChild(textarea);
    textarea.select();
    try {
        document.execCommand('copy');
        showCopiedToast();
    } catch (err) {
        showCopiedToast();
    }
    document.body.removeChild(textarea);
}

function showCopiedToast() {
    var toast = document.getElementById('copyToast');
    if (!toast) {
        toast = document.createElement('div');
        toast.id = 'copyToast';
        toast.style.cssText = 'position:fixed;top:50%;left:50%;transform:translate(-50%,-50%) scale(0.9);background:rgba(0,0,0,.75);color:#fff;font-size:.16rem;padding:.14rem .28rem;border-radius:.1rem;opacity:0;pointer-events:none;transition:all .25s ease;z-index:1000;font-weight:700;letter-spacing:.01rem;backdrop-filter:blur(8px);';
        document.body.appendChild(toast);
    }
    toast.textContent = 'Copied';
    toast.style.opacity = '0';
    toast.style.transform = 'translate(-50%,-50%) scale(0.9)';
    requestAnimationFrame(function() {
        toast.style.opacity = '1';
        toast.style.transform = 'translate(-50%,-50%) scale(1)';
    });
    setTimeout(function() {
        toast.style.opacity = '0';
        toast.style.transform = 'translate(-50%,-50%) scale(0.9)';
    }, 1000);
}

function buildDesignWorkListPagination(totalPages, currentPage) {
    var html = '<div class="dw-list-pagination">';
    html += '<button class="dw-list-page-btn prev" data-page="prev">&lt;</button>';
    for (var i = 1; i <= totalPages; i++) {
        html += '<button class="dw-list-page-btn ' + (i === currentPage ? 'active' : '') + '" data-page="' + i + '">' + i + '</button>';
    }
    html += '<button class="dw-list-page-btn next" data-page="next">&gt;</button>';
    html += '</div>';
    return html;
}

function bindDesignWorkListPagination() {
    var btns = document.querySelectorAll('.dw-list-page-btn');
    var totalPages = Math.ceil(dwItems.length / dwListPageSize);
    btns.forEach(function(btn) {
        btn.addEventListener('click', function() {
            var page = this.getAttribute('data-page');
            if (page === 'prev') {
                if (dwListCurrentPage > 1) dwListCurrentPage--;
            } else if (page === 'next') {
                if (dwListCurrentPage < totalPages) dwListCurrentPage++;
            } else {
                dwListCurrentPage = parseInt(page, 10);
            }
            var grid = document.getElementById('dwListGrid');
            if (grid) {
                grid.innerHTML = buildDesignWorkListCards(dwListCurrentPage);
                bindDesignWorkListClicks();
            }
            var paginationEl = document.querySelector('.dw-list-pagination');
            if (paginationEl) {
                var newPagination = buildDesignWorkListPagination(totalPages, dwListCurrentPage);
                var tempDiv = document.createElement('div');
                tempDiv.innerHTML = newPagination;
                var newBtns = tempDiv.querySelectorAll('.dw-list-page-btn');
                var oldBtns = paginationEl.querySelectorAll('.dw-list-page-btn');
                oldBtns.forEach(function(oldBtn, index) {
                    if (newBtns[index]) {
                        oldBtn.className = newBtns[index].className;
                    }
                });
            }
        });
    });
}

var discAudio = new Audio();
discAudio.src = discData.nowPlaying.audio;
discAudio.load();

var discProgressInterval = null;
var discIsPlaying = false;

(function initDiscAudioEvents() {
    discAudio.addEventListener('ended', function() {
        if (discData.playMode === 'repeat-one') {
            discAudio.currentTime = 0;
            discAudio.play().catch(function(){});
        } else {
            var nextIndex = getNextTrackIndex();
            loadDiscTrack(nextIndex);
            syncMiniPlayerWithDisc();
            discAudio.play().catch(function(){});
        }
    });
    discAudio.addEventListener('loadedmetadata', function() {
        var dur = document.getElementById('discDuration');
        if (dur && discAudio.duration) dur.textContent = formatDiscTime(discAudio.duration);
    });
    discAudio.addEventListener('play', function() {

            updateMiniPlayerState();
        }
    });
    discAudio.addEventListener('pause', function() {

            discIsPlaying = false;

})();

function loadDiscTrack(index) {
    if (index < 0) index = discData.tapes.length - 1;
    if (index >= discData.tapes.length) index = 0;
    discData.currentTapeIndex = index;
    var tape = discData.tapes[index];
    discData.nowPlaying = {
        title: tape.title,
        duration: tape.time,
        current: '0:00',
        cover: tape.cover,
        audio: tape.audio
    };

    var titleEl = document.getElementById('discTrackTitle');
    var bgEl = document.querySelector('.disc-page-bg');
    var labelEl = document.querySelector('.disc-vinyl-label');
    if (titleEl) titleEl.textContent = tape.title;
    if (bgEl) bgEl.style.backgroundImage = 'url(' + tape.cover + ')';
    if (labelEl) labelEl.style.backgroundImage = 'url(' + tape.cover + ')';

    var wasPlaying = discIsPlaying;
    discAudio.src = tape.audio;
    discAudio.load();
    if (wasPlaying) {
        discAudio.play().catch(function(){});
    }
}

function getNextTrackIndex() {
    if (discData.playMode === 'shuffle') {
        var nextIndex;
        do { nextIndex = Math.floor(Math.random() * discData.tapes.length); }
        while (nextIndex === discData.currentTapeIndex && discData.tapes.length > 1);
        return nextIndex;
    }
    var nextIndex = discData.currentTapeIndex + 1;
    if (nextIndex >= discData.tapes.length) nextIndex = 0;
    return nextIndex;
}

function getPrevTrackIndex() {
    if (discData.playMode === 'shuffle') {
        var prevIndex;
        do { prevIndex = Math.floor(Math.random() * discData.tapes.length); }
        while (prevIndex === discData.currentTapeIndex && discData.tapes.length > 1);
        return prevIndex;
    }
    var prevIndex = discData.currentTapeIndex - 1;
    if (prevIndex < 0) prevIndex = discData.tapes.length - 1;
    return prevIndex;
}

function bindDiscPlayerInteractions() {
    var playBtn = document.getElementById('discPlayBtn');
    var vinyl = document.getElementById('vinylWrapper');
    var playIcon = document.getElementById('discPlayIcon');
    var prevBtn = document.getElementById('discPrevBtn');
    var nextBtn = document.getElementById('discNextBtn');
    var playModeBtn = document.getElementById('discPlayModeBtn');
    var volumeToggleBtn = document.getElementById('discVolumeToggleBtn');
    var volumeTrack = document.getElementById('discVolumeTrack');
    var volumeBar = document.getElementById('discVolumeBar');
    var volumeIcon = document.getElementById('discVolumeIcon');
    var progressTrack = document.getElementById('discProgressTrack');
    var progressBar = document.getElementById('discProgressBar');
    if (!playBtn || !vinyl) return;

    var isMuted = false;
    var currentVolume = 0.7;
    var volumeVisible = false;
    var volumeHideTimer = null;

    discAudio.volume = currentVolume;

    syncDiscPlayPauseUI();

    playBtn.addEventListener('click', function() {
        togglePlayPause();
    });

    if (prevBtn) {
        prevBtn.addEventListener('click', function() {
            var idx = getPrevTrackIndex();
            loadDiscTrack(idx);
            if (!discIsPlaying) {
                discAudio.play().catch(function(){});
            }
            syncMiniPlayerWithDisc();
        });
    }

    if (nextBtn) {
        nextBtn.addEventListener('click', function() {
            var idx = getNextTrackIndex();
            loadDiscTrack(idx);
            if (!discIsPlaying) {
                discAudio.play().catch(function(){});
            }
            syncMiniPlayerWithDisc();
        });
    }

    if (playModeBtn) {
        playModeBtn.addEventListener('click', function() {
            var modes = ['sequence', 'shuffle', 'repeat-one'];
            var currentIndex = modes.indexOf(discData.playMode);
            discData.playMode = modes[(currentIndex + 1) % modes.length];
            playModeBtn.classList.toggle('active', discData.playMode === 'shuffle');
            var iconSvg = discData.playMode === 'shuffle' ?
                '<svg viewBox="0 0 24 24"><path d="M10.59 9.17L5.41 4 4 5.41l5.17 5.17 1.42-1.41zM14.5 4l2.04 2.04L4 18.59 5.41 20 17.96 7.46 20 9.5V4h-5.5zm.33 9.41l-1.41 1.41 3.13 3.13L14.5 20H20v-5.5l-2.04 2.04-3.13-3.13z"/></svg>' :
                discData.playMode === 'repeat-one' ?
                '<svg viewBox="0 0 24 24"><path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4zm-4-6H9v2h4v-2z"/></svg>' :
                '<svg viewBox="0 0 24 24"><path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z"/></svg>';
            playModeBtn.innerHTML = iconSvg;
        });
    }

    function updateVolumeIcon(vol, muted) {
        if (!volumeIcon) return;
        if (muted || vol <= 0) {
            volumeIcon.innerHTML = '<path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/>';
        } else {
            volumeIcon.innerHTML = '<path d="M3 9v6h4l5 5V4L7 9H3z"/>';
        }
    }

    function showVolumeTrack() {
        volumeVisible = true;
        if (volumeTrack) volumeTrack.classList.add('active');
        resetVolumeHideTimer();
    }

    function hideVolumeTrack() {
        volumeVisible = false;
        if (volumeTrack) volumeTrack.classList.remove('active');
        if (volumeHideTimer) {
            clearTimeout(volumeHideTimer);
            volumeHideTimer = null;
        }
    }

    function resetVolumeHideTimer() {
        if (volumeHideTimer) clearTimeout(volumeHideTimer);
        volumeHideTimer = setTimeout(function() {
            hideVolumeTrack();
        }, 3000);
    }

    if (volumeToggleBtn) {
        volumeToggleBtn.addEventListener('click', function() {
            if (volumeVisible) {
                hideVolumeTrack();
            } else {
                showVolumeTrack();
            }
        });
    }

    function setVolumeFromX(clientX) {
        if (!volumeTrack) return;
        var rect = volumeTrack.getBoundingClientRect();
        var percent = (clientX - rect.left) / rect.width;
        percent = Math.max(0, Math.min(1, percent));
        currentVolume = percent;
        discAudio.volume = currentVolume;
        if (isMuted && currentVolume > 0) {
            isMuted = false;
            discAudio.muted = false;
        }
        if (volumeBar) volumeBar.style.width = (percent * 100) + '%';
        updateVolumeIcon(currentVolume, isMuted);
        resetVolumeHideTimer();
    }

    var isDraggingVolume = false;
    if (volumeTrack) {
        volumeTrack.addEventListener('mousedown', function(e) {
            isDraggingVolume = true;
            setVolumeFromX(e.clientX);
        });
        volumeTrack.addEventListener('touchstart', function(e) {
            isDraggingVolume = true;
            if (e.touches && e.touches.length > 0) setVolumeFromX(e.touches[0].clientX);
        }, {passive: false});
    }
    window.addEventListener('mousemove', function(e) {
        if (isDraggingVolume) setVolumeFromX(e.clientX);
    });
    window.addEventListener('mouseup', function() {
        isDraggingVolume = false;
    });
    window.addEventListener('touchmove', function(e) {
        if (isDraggingVolume && e.touches && e.touches.length > 0) setVolumeFromX(e.touches[0].clientX);
    }, {passive: false});
    window.addEventListener('touchend', function() {
        isDraggingVolume = false;
    });

    function setProgressFromX(clientX) {
        if (!discAudio.duration || !progressTrack) return;
        var rect = progressTrack.getBoundingClientRect();
        var percent = (clientX - rect.left) / rect.width;
        percent = Math.max(0, Math.min(1, percent));
        discAudio.currentTime = percent * discAudio.duration;
        if (progressBar) progressBar.style.width = (percent * 100) + '%';
    }

    var isDraggingProgress = false;
    if (progressTrack) {
        progressTrack.addEventListener('mousedown', function(e) {
            isDraggingProgress = true;
            setProgressFromX(e.clientX);
        });
        progressTrack.addEventListener('touchstart', function(e) {
            isDraggingProgress = true;
            if (e.touches && e.touches.length > 0) setProgressFromX(e.touches[0].clientX);
        }, {passive: false});
    }
    window.addEventListener('mousemove', function(e) {
        if (isDraggingProgress) setProgressFromX(e.clientX);
    });
    window.addEventListener('mouseup', function() {
        isDraggingProgress = false;
    });
    window.addEventListener('touchmove', function(e) {
        if (isDraggingProgress && e.touches && e.touches.length > 0) setProgressFromX(e.touches[0].clientX);
    }, {passive: false});
    window.addEventListener('touchend', function() {
        isDraggingProgress = false;
    });
}

var dwZoomedCard = null;
var dwZoomedCardOriginalTransform = '';

function positionFanCards() {
    var cards = document.querySelectorAll('.dw-card');
    var total = cards.length;
    var fanAngle = 60;
    var startAngle = -fanAngle / 2;
    var step = fanAngle / (total - 1);
    var radius = 3.2;

    cards.forEach(function(card, i) {
        var angle = startAngle + step * i;
        var rad = angle * Math.PI / 180;
        var x = Math.sin(rad) * radius;
        var y = (1 - Math.cos(rad)) * radius * 0.3;
        var transform = 'translate(' + x.toFixed(3) + 'rem, ' + y.toFixed(3) + 'rem) rotate(' + angle.toFixed(1) + 'deg)';
        card.style.transform = transform;
        card.setAttribute('data-fan-transform', transform);
    });
}

function liftCard(card) {

    card.style.transform = lifted;
    card.style.zIndex = '100';
}

function unliftCard(card) {

function zoomToCard(card, id) {
    dwZoomedCard = card;
    var overlay = document.getElementById('dwFanOverlay');
    if (overlay) overlay.classList.add('active');

    var rect = card.getBoundingClientRect();
    var centerX = window.innerWidth / 2;
    var centerY = window.innerHeight / 2;
    var cardCenterX = rect.left + rect.width / 2;
    var cardCenterY = rect.top + rect.height / 2;

    var scaleX = window.innerWidth / rect.width * 0.85;
    var scaleY = window.innerHeight / rect.height * 0.85;
    var scale = Math.min(scaleX, scaleY);

    var translateX = centerX - cardCenterX;
    var translateY = centerY - cardCenterY;

    dwZoomedCardOriginalTransform = card.getAttribute('data-fan-transform') || card.style.transform;

    card.classList.add('zoomed');
    card.style.transform = 'translate(' + translateX + 'px, ' + translateY + 'px) scale(' + scale + ') rotate(0deg)';
    card.style.left = rect.left + 'px';
    card.style.top = rect.top + 'px';

    setTimeout(function() {
        window.location.hash = '#/design-work/detail/' + id;
        dwZoomedCard = null;
    }, 700);
}

function resetFanCards() {

        card.classList.remove('zoomed');
        card.style.left = '';

        if (fanTransform) {
            card.style.transform = fanTransform;

function handleRoute() {
    var hash = window.location.hash.replace('#/', '');
    if (!hash) {
        navigateTo('home');
    } else if (hash.indexOf('fresh/detail/') === 0) {
        var id = parseInt(hash.replace('fresh/detail/', ''), 10);
        if (!isNaN(id) && freshItems[id]) {
            navigateToFreshDetail(id);
        } else {
            navigateTo('fresh');
        }
    } else if (hash.indexOf('design-work/detail/') === 0) {
        var id = parseInt(hash.replace('design-work/detail/', ''), 10);
        if (!isNaN(id) && dwItems[id]) {
            navigateToDesignWorkDetail(id);
        } else {
            navigateTo('design-work');
        }
    } else if (hash === 'design-work-list') {
        navigateTo('design-work-list');
    } else if (hash === 'signin' || hash === 'signup') {
        navigateTo(hash);
    } else {
        navigateTo(hash);
    }
}

var discVisited = false;
var discAutoPlayed = false;

function updateMiniPlayerState() {
    if (!miniPlayer) return;
    var isDiscPage = currentPage === 'disc-library';
    var isPlayingOnDiscPage = isDiscPage && discIsPlaying;
    var shouldShow = miniPlayerVisible && !isDiscPage;

    if (!discVisited) {
        miniPlayer.classList.add('hidden', 'no-interaction');
        miniPlayer.classList.remove('playing', 'paused');
        return;
    }

    if (isPlayingOnDiscPage) {
        miniPlayer.classList.add('no-interaction');
        miniPlayer.classList.remove('hidden');
    } else if (shouldShow) {
        miniPlayer.classList.remove('hidden', 'no-interaction');
        if (discIsPlaying) {
            miniPlayer.classList.add('playing');
            miniPlayer.classList.remove('paused');
        } else {
            miniPlayer.classList.add('paused');
            miniPlayer.classList.remove('playing');
        }
    } else {
        miniPlayer.classList.add('hidden');
        miniPlayer.classList.remove('no-interaction');
    }
    updateMiniPlayerPlayIcon();
}

function updateMiniPlayerPlayIcon() {
    if (!miniPlayerPlayIcon) return;
    if (discIsPlaying) {
        miniPlayerPlayIcon.innerHTML = '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>';
    } else {
        miniPlayerPlayIcon.innerHTML = '<path d="M8 5v14l11-7z"/>';
    }
}

function updateMiniPlayerProgress() {
    if (miniPlayerProgressBar && discAudio.duration) {
        miniPlayerProgressBar.style.width = (discAudio.currentTime / discAudio.duration * 100) + '%';
    }
    if (miniPlayerCurrentTime) miniPlayerCurrentTime.textContent = formatDiscTime(discAudio.currentTime);
    if (miniPlayerDuration && discAudio.duration) miniPlayerDuration.textContent = formatDiscTime(discAudio.duration);
}

function syncMiniPlayerWithDisc() {
    if (!miniPlayerVinylLabel || !miniPlayerCoverImg || !miniPlayerTitle) return;
    miniPlayerVinylLabel.style.backgroundImage = 'url(' + discData.nowPlaying.cover + ')';
    miniPlayerCoverImg.src = discData.nowPlaying.cover;
    miniPlayerTitle.textContent = discData.nowPlaying.title;
    updateMiniPlayerProgress();
    updateMiniPlayerPlayIcon();
}

function showMiniPlayer() {
    miniPlayerVisible = true;
    syncMiniPlayerWithDisc();
    updateMiniPlayerState();
}

function hideMiniPlayer() {
    miniPlayerVisible = false;
    updateMiniPlayerState();
}

function pauseFromMiniPlayer() {
    discAudio.pause();
}

function togglePlayPause() {
    if (discIsPlaying) {
        discAudio.pause();
    } else {
        discAudio.play().catch(function(){});
    }
}

function syncDiscPlayPauseUI() {
    var vinylWrapper = document.getElementById('vinylWrapper');
    var playIcon = document.getElementById('discPlayIcon');
    if (discIsPlaying) {
        if (vinylWrapper) {
            vinylWrapper.classList.remove('paused');
            vinylWrapper.classList.add('playing');
        }
        if (playIcon) playIcon.innerHTML = '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>';
        if (discProgressInterval) clearInterval(discProgressInterval);
        discProgressInterval = setInterval(updateDiscProgress, 500);
    } else {
        if (vinylWrapper) {
            vinylWrapper.classList.remove('playing');
            vinylWrapper.classList.add('paused');
        }
        if (playIcon) playIcon.innerHTML = '<path d="M8 5v14l11-7z"/>';
        if (discProgressInterval) clearInterval(discProgressInterval);
    }
}

function goToDiscFromMiniPlayer() {
    window.location.hash = '#/disc-library';
}

function setMiniPlayerProgressFromX(clientX) {
    if (!miniPlayerProgressTrack || !discAudio.duration) return;
    var rect = miniPlayerProgressTrack.getBoundingClientRect();
    var percent = (clientX - rect.left) / rect.width;
    percent = Math.max(0, Math.min(1, percent));
    discAudio.currentTime = percent * discAudio.duration;
    updateMiniPlayerProgress();
    updateDiscProgress();
}

function isMiniPlayerControlElement(target) {
    return target.closest('.mini-player-close') ||
           target.closest('.mini-player-card-btn') ||
           target.closest('.mini-player-card-play-btn') ||
           target.closest('.mini-player-card-progress') ||
           target.closest('.mini-player-card-cover');
}

if (miniPlayer) {
    miniPlayer.addEventListener('mousedown', function(e) {
        if (isMiniPlayerControlElement(e.target)) return;
        miniPlayerDrag.isDragging = true;
        miniPlayerDrag.hasMoved = false;
        miniPlayerDrag.startX = e.clientX;
        miniPlayerDrag.startY = e.clientY;
        var rect = miniPlayer.getBoundingClientRect();
        miniPlayerDrag.initialLeft = rect.left;
        miniPlayerDrag.initialTop = rect.top;
        miniPlayer.style.transition = 'none';
        miniPlayer.style.cursor = 'grabbing';
    });

    miniPlayer.addEventListener('touchstart', function(e) {
        if (isMiniPlayerControlElement(e.target)) return;
        miniPlayerDrag.isDragging = true;
        miniPlayerDrag.hasMoved = false;
        var touch = e.touches[0];
        miniPlayerDrag.startX = touch.clientX;
        miniPlayerDrag.startY = touch.clientY;
        var rect = miniPlayer.getBoundingClientRect();
        miniPlayerDrag.initialLeft = rect.left;
        miniPlayerDrag.initialTop = rect.top;
        miniPlayer.style.transition = 'none';
    }, { passive: false });

    miniPlayer.addEventListener('mouseenter', function(e) {
        if (!isMiniPlayerControlElement(e.target)) {
            miniPlayer.style.cursor = 'grab';
        }
    });

    miniPlayer.addEventListener('mouseleave', function() {
        miniPlayer.style.cursor = 'grab';
    });
}

window.addEventListener('mousemove', function(e) {
    if (!miniPlayerDrag.isDragging) return;
    var dx = e.clientX - miniPlayerDrag.startX;
    var dy = e.clientY - miniPlayerDrag.startY;
    if (Math.abs(dx) > 3 || Math.abs(dy) > 3) miniPlayerDrag.hasMoved = true;
    var newLeft = miniPlayerDrag.initialLeft + dx;
    var newTop = miniPlayerDrag.initialTop + dy;
    var maxLeft = window.innerWidth - miniPlayer.offsetWidth;
    var maxTop = window.innerHeight - miniPlayer.offsetHeight;
    newLeft = Math.max(0, Math.min(maxLeft, newLeft));
    newTop = Math.max(0, Math.min(maxTop, newTop));
    miniPlayer.style.left = newLeft + 'px';
    miniPlayer.style.top = newTop + 'px';
    miniPlayer.style.right = 'auto';
    miniPlayer.style.bottom = 'auto';
});

window.addEventListener('touchmove', function(e) {
    if (!miniPlayerDrag.isDragging) return;
    var touch = e.touches[0];
    var dx = touch.clientX - miniPlayerDrag.startX;
    var dy = touch.clientY - miniPlayerDrag.startY;
    if (Math.abs(dx) > 3 || Math.abs(dy) > 3) miniPlayerDrag.hasMoved = true;
    var newLeft = miniPlayerDrag.initialLeft + dx;
    var newTop = miniPlayerDrag.initialTop + dy;
    var maxLeft = window.innerWidth - miniPlayer.offsetWidth;
    var maxTop = window.innerHeight - miniPlayer.offsetHeight;
    newLeft = Math.max(0, Math.min(maxLeft, newLeft));
    newTop = Math.max(0, Math.min(maxTop, newTop));
    miniPlayer.style.left = newLeft + 'px';
    miniPlayer.style.top = newTop + 'px';
    miniPlayer.style.right = 'auto';
    miniPlayer.style.bottom = 'auto';
}, { passive: false });

window.addEventListener('mouseup', function() {
    if (miniPlayerDrag.isDragging) {
        miniPlayerDrag.isDragging = false;
        if (miniPlayer) {
            miniPlayer.style.transition = 'transform .2s,opacity .3s';
            miniPlayer.style.cursor = 'grab';
        }
    }
});

window.addEventListener('touchend', function() {
    if (miniPlayerDrag.isDragging) {
        miniPlayerDrag.isDragging = false;
        if (miniPlayer) {
            miniPlayer.style.transition = 'transform .2s,opacity .3s';
            miniPlayer.style.cursor = 'grab';
        }
    }
});

if (miniPlayerClose) {
    miniPlayerClose.addEventListener('click', function() {
        pauseFromMiniPlayer();
        hideMiniPlayer();
    });
}

if (miniPlayerPrevBtn) {
    miniPlayerPrevBtn.addEventListener('click', function() {
        var idx = getPrevTrackIndex();
        loadDiscTrack(idx);
        syncMiniPlayerWithDisc();
        if (!discIsPlaying) {
            discAudio.play().catch(function(){});
        }
    });
}

if (miniPlayerNextBtn) {
    miniPlayerNextBtn.addEventListener('click', function() {
        var idx = getNextTrackIndex();
        loadDiscTrack(idx);
        syncMiniPlayerWithDisc();
        if (!discIsPlaying) {
            discAudio.play().catch(function(){});
        }
    });
}

if (miniPlayerPlayBtn) {
    miniPlayerPlayBtn.addEventListener('click', function(e) {
        e.stopPropagation();
        togglePlayPause();
    });
}

if (miniPlayerProgressTrack) {
    miniPlayerProgressTrack.addEventListener('click', function(e) {
        e.stopPropagation();
        setMiniPlayerProgressFromX(e.clientX);
    });
}

if (miniPlayerCardCover) {
    miniPlayerCardCover.addEventListener('click', function(e) {
        if (miniPlayerDrag.hasMoved) return;
        goToDiscFromMiniPlayer();
    });
}

var originalNavigateTo = navigateTo;
navigateTo = function(pageName) {
    var wasDiscPage = currentPage === 'disc-library';
    originalNavigateTo(pageName);
    if (pageName !== 'disc-library' && discAudio && discAudio.src) {
        showMiniPlayer();
    }
    setTimeout(updateMiniPlayerState, 50);
};

window.addEventListener('hashchange', handleRoute);
handleRoute();

})();
</script>

</body>
</html>
