<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=0, minimum-scale=1.0, maximum-scale=1.0">
<title>Profile - Vipen</title>
<link rel="Shortcut Icon" href="images/favicon.png">
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="js/core/comet-trail.js"></script>
<link rel="stylesheet" href="css/pages/profile.css">

</head>
<body>

<a href="index.html#/" class="back-link">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
</a>

<div class="comet-canvas" id="cometCanvas"></div>

<div class="profile-container">
    <div class="profile-left">
        <div class="profile-header">
            <div class="profile-avatar">
                <img src="https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=200&q=80" alt="Avatar" id="profileAvatarImg">
                <div class="profile-avatar-edit" id="avatarEditBtn">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
                </div>
                <input type="file" id="avatarInput" accept="image/*">
            </div>
            <h1 class="profile-name" id="displayName">Alex Chen</h1>
            <p class="profile-handle" id="userHandle">@alexchen</p>
        </div>

        <div class="profile-section active" id="socialSection">
            <div class="section-title">Connected Accounts</div>
            <div class="info-card">
                <div class="social-row">
                    <div class="social-icon instagram">
                        <svg viewBox="0 0 24 24" fill="white"><path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zm0-2.163c-3.259 0-3.667.014-4.947.072-4.358.2-6.78 2.618-6.98 6.98-.059 1.281-.073 1.689-.073 4.948 0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98-1.281-.059-1.69-.073-4.949-.073zm0 5.838c-3.403 0-6.162 2.759-6.162 6.162s2.759 6.163 6.162 6.163 6.162-2.759 6.162-6.163c0-3.403-2.759-6.162-6.162-6.162zm0 10.162c-2.209 0-4-1.79-4-4 0-2.209 1.791-4 4-4s4 1.791 4 4c0 2.21-1.791 4-4 4zm6.406-11.845c-.796 0-1.441.645-1.441 1.44s.645 1.44 1.441 1.44c.795 0 1.439-.645 1.439-1.44s-.644-1.44-1.439-1.44z"/></svg>
                    </div>
                    <div class="social-info">
                        <div class="social-name">Instagram</div>
                        <div class="social-handle" id="instagramHandle">Not connected</div>
                    </div>
                    <button class="social-link-btn" data-platform="instagram" id="instagramBtn">Link</button>
                </div>
                <div class="social-row">
                    <div class="social-icon x">
                        <svg viewBox="0 0 24 24" fill="white"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>
                    </div>
                    <div class="social-info">
                        <div class="social-name">X (Twitter)</div>
                        <div class="social-handle" id="xHandle">Not connected</div>
                    </div>
                    <button class="social-link-btn" data-platform="x" id="xBtn">Link</button>
                </div>
                <div class="social-row">
                    <div class="social-icon youtube">
                        <svg viewBox="0 0 24 24" fill="white"><path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/></svg>
                    </div>
                    <div class="social-info">
                        <div class="social-name">YouTube</div>
                        <div class="social-handle" id="youtubeHandle">Not connected</div>
                    </div>
                    <button class="social-link-btn" data-platform="youtube" id="youtubeBtn">Link</button>
                </div>
                <div class="social-row">
                    <div class="social-icon tiktok">
                        <svg viewBox="0 0 24 24" fill="white"><path d="M12.525.02c1.31-.02 2.61-.01 3.91-.02.08 1.53.63 3.09 1.75 4.17 1.12 1.11 2.7 1.62 4.24 1.79v4.03c-1.44-.05-2.89-.35-4.2-.97-.57-.26-1.1-.59-1.62-.93-.01 2.92.01 5.84-.02 8.75-.08 1.4-.54 2.79-1.35 3.94-1.31 1.92-3.58 3.17-5.91 3.21-1.43.08-2.86-.31-4.08-1.03-2.02-1.19-3.44-3.37-3.65-5.71-.02-.5-.03-1-.01-1.49.18-1.9 1.12-3.72 2.58-4.96 1.66-1.44 3.98-2.13 6.15-1.72.02 1.48-.04 2.96-.04 4.44-.99-.32-2.15-.23-3.02.37-.63.41-1.11 1.04-1.36 1.75-.21.51-.15 1.07-.14 1.61.24 1.64 1.82 3.02 3.5 2.87 1.12-.01 2.19-.66 2.77-1.61.19-.33.4-.67.41-1.06.1-1.79.06-3.57.07-5.36.01-4.03-.01-8.05.02-12.07z"/></svg>
                    </div>
                    <div class="social-info">
                        <div class="social-name">TikTok</div>
                        <div class="social-handle" id="tiktokHandle">Not connected</div>
                    </div>
                    <button class="social-link-btn" data-platform="tiktok" id="tiktokBtn">Link</button>
                </div>
            </div>
        </div>
    </div>

    <div class="profile-right">
        <div class="profile-section active" id="infoSection">
            <div class="section-title">Basic Information</div>
            <div class="info-card">
                <div class="info-row editable" data-field="displayName" data-label="Display Name">
                    <span class="info-label">Display Name</span>
                    <div class="info-value-wrapper">
                        <span class="info-value" id="infoDisplayName">Alex Chen</span>
                        <svg class="info-edit-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
                    </div>
                </div>
                <div class="info-row editable" data-field="username" data-label="Username">
                    <span class="info-label">Username</span>
                    <div class="info-value-wrapper">
                        <span class="info-value" id="infoUsername">@alexchen</span>
                        <svg class="info-edit-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
                    </div>
                </div>
                <div class="info-row editable" data-field="email" data-label="Email">
                    <span class="info-label">Email</span>
                    <div class="info-value-wrapper">
                        <span class="info-value" id="infoEmail">alex@example.com</span>
                        <svg class="info-edit-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
                    </div>
                </div>
                <div class="info-row editable" data-field="bio" data-label="Bio">
                    <span class="info-label">Bio</span>
                    <div class="info-value-wrapper">
                        <span class="info-value" id="infoBio">Digital creator & designer</span>
                        <svg class="info-edit-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
                    </div>
                </div>
                <div class="info-row editable" data-field="location" data-label="Location">
                    <span class="info-label">Location</span>
                    <div class="info-value-wrapper">
                        <span class="info-value" id="infoLocation">Shanghai, China</span>
                        <svg class="info-edit-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
                    </div>
                </div>
                <div class="info-row editable" data-field="gender" data-label="Gender">
                    <span class="info-label">Gender</span>
                    <div class="info-value-wrapper">
                        <span class="info-value" id="infoGender">Not set</span>
                        <svg class="info-edit-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
                    </div>
                </div>
            </div>

            
        </div>
    </div>
</div>

<div class="edit-modal" id="editModal">
    <div class="edit-modal-overlay" id="editModalOverlay"></div>
    <div class="edit-modal-content">
        <div class="edit-modal-header" id="editModalTitle">Edit</div>
        <div id="editModalBody">
            <input type="text" class="edit-modal-input" id="editModalInput" placeholder="Enter value...">
        </div>
        <div class="edit-modal-actions">
            <button class="edit-modal-btn cancel" id="editModalCancel">Cancel</button>
            <button class="edit-modal-btn save" id="editModalSave">Save</button>
        </div>
    </div>
</div>

<div class="toast" id="toast"></div>

<script src="js/pages/profile.js"></script>

<script src="anti-scrape.js"></script>

</body>
</html>
