<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Design Upload — Vipen</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a0f;color:#fff;font-family:'Segoe UI',system-ui,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center}
.wrap{width:100%;max-width:520px;padding:40px 24px}
h1{font-size:28px;font-weight:700;letter-spacing:.02em;margin-bottom:8px}
.sub{font-size:14px;color:rgba(255,255,255,.4);margin-bottom:32px}

.dropzone{border:2px dashed rgba(255,255,255,.15);border-radius:16px;padding:48px 24px;text-align:center;cursor:pointer;transition:all .25s;background:rgba(255,255,255,.02);margin-bottom:24px}
.dropzone:hover,.dropzone.drag{border-color:rgba(255,255,255,.35);background:rgba(255,255,255,.04)}
.dropzone.active{border-color:#d4a853;background:rgba(212,168,83,.06)}
.dropzone svg{width:40px;height:40px;color:rgba(255,255,255,.2);margin-bottom:12px}
.dropzone .dz-title{font-size:15px;font-weight:600;margin-bottom:6px}
.dropzone .dz-hint{font-size:12px;color:rgba(255,255,255,.3)}
.dropzone input{display:none}

.preview{background:rgba(255,255,255,.03);border-radius:12px;padding:20px;margin-bottom:24px;display:none}
.preview.show{display:block}
.preview h2{font-size:13px;color:rgba(255,255,255,.4);text-transform:uppercase;letter-spacing:.06em;margin-bottom:12px}
.pv-row{display:flex;justify-content:space-between;padding:6px 0;font-size:13px;border-bottom:1px solid rgba(255,255,255,.05)}
.pv-row .key{color:rgba(255,255,255,.4)}
.files-list{margin-top:8px;font-size:12px;color:rgba(255,255,255,.3)}
.files-list span{display:inline-block;background:rgba(255,255,255,.06);padding:2px 8px;border-radius:4px;margin:2px 4px 2px 0}

.btn{width:100%;padding:14px;border:none;border-radius:10px;font-size:15px;font-weight:600;cursor:pointer;transition:all .2s;letter-spacing:.02em}
.btn-upload{background:#d4a853;color:#000}
.btn-upload:hover{background:#e0b960}
.btn-upload:disabled{opacity:.3;cursor:not-allowed}

.status{margin-top:16px;padding:12px;border-radius:8px;font-size:13px;text-align:center;display:none}
.status.show{display:block}
.status.ok{background:rgba(34,197,94,.1);color:#4ade80;border:1px solid rgba(34,197,94,.2)}
.status.err{background:rgba(239,68,68,.1);color:#f87171;border:1px solid rgba(239,68,68,.2)}
.status.info{background:rgba(59,130,246,.1);color:#60a5fa;border:1px solid rgba(59,130,246,.2)}

.progress{height:4px;background:rgba(255,255,255,.06);border-radius:2px;margin-top:16px;overflow:hidden;display:none}
.progress.show{display:block}
.progress .bar{height:100%;background:#d4a853;width:0;transition:width .3s}

.back{display:block;text-align:center;margin-top:20px;font-size:12px;color:rgba(255,255,255,.25);text-decoration:none}
.back:hover{color:rgba(255,255,255,.5)}
</style>
</head>
<body>
<div class="wrap">
  <h1>🎨 Design Upload</h1>
  <p class="sub">Select a project folder containing images + meta.txt</p>

  <div class="dropzone" id="dropzone">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
    <div class="dz-title">Click to select folder</div>
    <div class="dz-hint">or drag & drop here</div>
    <input type="file" id="folderInput" webkitdirectory multiple>
  </div>

  <div class="preview" id="preview">
    <h2>Preview</h2>
    <div id="metaPreview"></div>
    <div class="files-list" id="filesPreview"></div>
  </div>

  <button class="btn btn-upload" id="uploadBtn" disabled>Upload to R2</button>
  <div class="progress" id="progress"><div class="bar" id="progressBar"></div></div>
  <div class="status" id="status"></div>
  <a class="back" href="/">← Back to site</a>
</div>

<script>
var selectedFiles = [];

// Folder picker
var dropzone = document.getElementById('dropzone');
var input = document.getElementById('folderInput');

dropzone.addEventListener('click', function() { input.click(); });
input.addEventListener('change', handleFiles);

dropzone.addEventListener('dragover', function(e) {
    e.preventDefault();
    dropzone.classList.add('drag');
});
dropzone.addEventListener('dragleave', function() {
    dropzone.classList.remove('drag');
});
dropzone.addEventListener('drop', function(e) {
    e.preventDefault();
    dropzone.classList.remove('drag');
    if (e.dataTransfer.items) {
        var items = e.dataTransfer.items;
        var files = [];
        var pending = items.length;
        for (var i = 0; i < items.length; i++) {
            (function(item) {
                var entry = item.webkitGetAsEntry ? item.webkitGetAsEntry() : null;
                if (entry && entry.isDirectory) {
                    readDir(entry, '', function(dirFiles) {
                        files = files.concat(dirFiles);
                        pending--;
                        if (pending === 0) processSelection(files);
                    });
                } else {
                    pending--;
                    if (pending === 0) processSelection(files);
                }
            })(items[i]);
        }
    }
});

function handleFiles(e) {
    processSelection(Array.from(e.target.files));
}

function readDir(dirEntry, prefix, cb) {
    var files = [];
    var reader = dirEntry.createReader();
    reader.readEntries(function(entries) {
        var todo = entries.length;
        if (todo === 0) { cb(files); return; }
        entries.forEach(function(entry) {
            if (entry.isFile) {
                entry.file(function(file) {
                    file.relativePath = prefix + file.name;
                    files.push(file);
                    todo--;
                    if (todo === 0) cb(files);
                });
            } else if (entry.isDirectory) {
                readDir(entry, prefix + entry.name + '/', function(subFiles) {
                    files = files.concat(subFiles);
                    todo--;
                    if (todo === 0) cb(files);
                });
            } else {
                todo--;
                if (todo === 0) cb(files);
            }
        });
    });
}

function processSelection(files) {
    if (!files || files.length === 0) return;
    selectedFiles = files;
    dropzone.classList.add('active');

    // Find meta.txt
    var metaFile = files.find(function(f) {
        return f.name === 'meta.txt' || (f.relativePath && f.relativePath.endsWith('meta.txt'));
    });

    var preview = document.getElementById('preview');
    var metaPreview = document.getElementById('metaPreview');
    var filesPreview = document.getElementById('filesPreview');
    var uploadBtn = document.getElementById('uploadBtn');

    // Show file list
    var imageFiles = files.filter(function(f) { return /\.(png|jpe?g|gif|webp)$/i.test(f.name); });
    filesPreview.innerHTML = imageFiles.map(function(f) {
        return '<span>' + (f.relativePath || f.name) + '</span>';
    }).join(' ');

    if (metaFile) {
        var reader = new FileReader();
        reader.onload = function() {
            var text = reader.result;
            var lines = text.split('\n');
            var html = '';
            var folderName = metaFile.relativePath ? metaFile.relativePath.replace(/\/meta\.txt$/, '') : '';
            if (!folderName && metaFile.webkitRelativePath) {
                folderName = metaFile.webkitRelativePath.replace(/\/meta\.txt$/, '');
            }
            if (folderName) {
                html += '<div class="pv-row"><span class="key">Folder</span><span>' + folderName + '</span></div>';
            }
            for (var i = 0; i < lines.length; i++) {
                var eq = lines[i].indexOf('=');
                if (eq > 0) {
                    html += '<div class="pv-row"><span class="key">' +
                        lines[i].slice(0, eq).trim() + '</span><span>' +
                        lines[i].slice(eq + 1).trim() + '</span></div>';
                }
            }
            metaPreview.innerHTML = html;
            uploadBtn.disabled = false;
        };
        reader.readAsText(metaFile);

        // Store folder name
        selectedFiles._folderName = metaFile.relativePath ?
            metaFile.relativePath.replace(/\/meta\.txt$/, '').split('/').pop() :
            (metaFile.webkitRelativePath || '').replace(/\/meta\.txt$/, '').split('/').pop() ||
            files[0].webkitRelativePath.split('/')[0];

    } else {
        metaPreview.innerHTML = '<div style="color:#f87171;font-size:13px">⚠️ meta.txt not found in folder</div>';
        uploadBtn.disabled = true;
    }

    preview.classList.add('show');
}

// Upload
document.getElementById('uploadBtn').addEventListener('click', function() {
    var formData = new FormData();
    // Add folder name
    var folderName = selectedFiles._folderName || 'Untitled';
    formData.append('folderName', folderName);

    for (var i = 0; i < selectedFiles.length; i++) {
        var f = selectedFiles[i];
        var name = f.relativePath ? f.relativePath.split('/').pop() : f.name;
        // Only send meta.txt + image files
        if (name === 'meta.txt' || /\.(png|jpe?g|gif|webp)$/i.test(name)) {
            formData.append('files', f, name);
        }
    }

    var btn = document.getElementById('uploadBtn');
    var progress = document.getElementById('progress');
    var progressBar = document.getElementById('progressBar');
    var status = document.getElementById('status');

    btn.disabled = true;
    btn.textContent = 'Uploading...';
    progress.classList.add('show');
    progressBar.style.width = '0%';
    status.classList.remove('show', 'ok', 'err', 'info');

    var xhr = new XMLHttpRequest();
    xhr.open('POST', '/api/design/upload');
    xhr.withCredentials = true;

    xhr.upload.onprogress = function(e) {
        if (e.lengthComputable) {
            var pct = Math.round(e.loaded / e.total * 90);
            progressBar.style.width = pct + '%';
        }
    };

    xhr.onload = function() {
        progressBar.style.width = '100%';
        setTimeout(function() { progress.classList.remove('show'); }, 600);

        var resp;
        try { resp = JSON.parse(xhr.responseText); } catch(e) {}

        btn.disabled = false;
        btn.textContent = 'Upload to R2';

        if (xhr.status === 200 && resp && resp.success) {
            status.textContent = '✅ ' + resp.entry.title + ' uploaded! (' + resp.files + ' files) — index.json updated.';
            status.className = 'status show ok';
        } else {
            var msg = (resp && resp.error) || 'Upload failed';
            status.textContent = '❌ ' + msg;
            status.className = 'status show err';
        }
    };

    xhr.onerror = function() {
        progress.classList.remove('show');
        btn.disabled = false;
        btn.textContent = 'Upload to R2';
        status.textContent = '❌ Network error. Check if server is running.';
        status.className = 'status show err';
    };

    xhr.send(formData);
});
</script>
</body>
</html>
