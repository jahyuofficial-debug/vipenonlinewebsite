<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=0, minimum-scale=1.0, maximum-scale=1.0">
<title>Sign Up - Vipen</title>
<link rel="Shortcut Icon" href="images/favicon.png">
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<style>
*,:after,:before{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Helvetica Neue',Helvetica,Arial,sans-serif}
html{font-size:calc(100vw/19.2);scroll-behavior:smooth}
body{position:relative;background:#000;color:#fff;overflow:hidden;height:100vh;display:flex;flex-direction:column;align-items:center}
body::before{content:'';position:fixed;top:0;left:0;width:100%;height:100%;background:url('images/REGISTERPAGE.png') center/cover no-repeat;opacity:.6;z-index:-1}

.comet-canvas{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:0}
.comet-particle{position:absolute;border-radius:50%;pointer-events:none;will-change:transform,opacity}
a{text-decoration:none;color:inherit}
input,button{outline:none;font-family:inherit}
::selection{background-color:transparent}

.signup-container{width:100%;max-width:4.2rem;padding:0 .4rem;display:flex;flex-direction:column;align-items:center;height:100vh;justify-content:flex-start;padding-top:.15rem;padding-bottom:.15rem}

.signup-header{width:100%;display:flex;flex-direction:column;align-items:center;margin-bottom:.1rem;flex-shrink:0}
.signup-logo{width:3.6rem;height:3.6rem;margin-bottom:0;opacity:.9}
.signup-logo img{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 .02rem .06rem rgba(0,0,0,.45))}

.signup-title{font-size:.48rem;font-weight:900;color:#fff;margin-bottom:0;letter-spacing:-.004em;text-align:center;font-family:'SF Pro Display','Helvetica Neue',Helvetica,Arial,sans-serif;font-style:italic;line-height:1.1;margin-top:-.1rem}
.signup-subtitle{font-size:.12rem;color:rgba(255,255,255,.4);text-align:center;font-weight:700;font-style:italic;margin-bottom:0;line-height:1.2;margin-top:0}

.signup-title,.signup-subtitle{position:relative;transform:translateY(-80%)}
.signup-subtitle{transform:translateY(-240%)}

.signup-form{width:100%;display:flex;flex-direction:column;gap:.15rem;margin-top:.06rem;position:relative;transform:translateY(-10%)}

.input-group{position:relative;width:100%;display:flex;align-items:center}

.input-field{width:100%;height:.36rem;background:#333;border:none;border-radius:.08rem;padding:0 .12rem;padding-right:.38rem;font-size:.11rem;color:#fff;transition:border-color .3s,background .3s,box-shadow .3s;-webkit-appearance:none;box-shadow:0 .04rem .12rem rgba(0,0,0,.5)}
.input-field::placeholder{color:rgba(255,255,255,.25);font-weight:400}
.input-field:hover{box-shadow:0 .06rem .16rem rgba(0,0,0,.7)}
.input-field:focus{box-shadow:0 .06rem .2rem rgba(0,0,0,.8);outline:none}
.input-field.error{border:2px solid rgba(255,80,80,.8)!important;animation:shake .4s ease}
.input-field.valid{border:2px solid rgba(50,200,100,.5)}

@keyframes shake{
    0%,100%{transform:translateX(0)}
    15%{transform:translateX(-6px)}
    30%{transform:translateX(5px)}
    45%{transform:translateX(-4px)}
    60%{transform:translateX(3px)}
    75%{transform:translateX(-2px)}
}

.validation-icon{position:absolute;right:.12rem;top:0;transform:translateY(0) scale(0);width:.18rem;height:.36rem;transition:transform .25s cubic-bezier(.34,1.56,.64,1);pointer-events:none;display:flex;align-items:center;justify-content:center}
.validation-icon.show{transform:translateY(0) scale(1)}
.validation-icon svg{width:100%;height:100%;display:block}

.password-toggle{position:absolute;right:.08rem;top:0;transform:translateY(0);width:.28rem;height:.36rem;background:none;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,.35);transition:color .2s;padding:0;z-index:2}
.password-toggle:hover{color:rgba(255,255,255,.7)}
.password-toggle svg{width:.2rem;height:.2rem;display:block}

.input-group.has-toggle .input-field{padding-right:.4rem}
.input-group.has-toggle .validation-icon{right:.36rem}

.error-text{position:absolute;right:-.04rem;top:0;transform:translateY(0) translateX(100%);font-size:.09rem;color:rgba(255,80,80,.9);white-space:nowrap;opacity:0;transition:opacity .25s;padding-left:.08rem;pointer-events:none;height:.36rem;display:flex;align-items:center}
.error-text.show{opacity:1}

.email-code-group{display:flex;gap:.15rem;align-items:center}
.email-code-group .input-field{flex:1}
.send-code-btn{height:.36rem;padding:0 .12rem;background:#000;border:none;border-radius:.08rem;color:rgba(255,255,255,.7);font-size:.1rem;font-weight:500;cursor:pointer;transition:all .3s;white-space:nowrap;flex-shrink:0;box-shadow:0 .04rem .12rem rgba(0,0,0,.5)}
.send-code-btn:hover{box-shadow:0 .06rem .16rem rgba(0,0,0,.7);color:#fff}
.send-code-btn:disabled{background:#000;box-shadow:0 .02rem .06rem rgba(0,0,0,.3);color:rgba(255,255,255,.2);cursor:not-allowed}
.send-code-btn.active{background:#32c864;color:#000}
.send-code-btn.active:hover{box-shadow:0 .06rem .16rem rgba(0,0,0,.7)}
.send-code-btn.active:disabled{background:#1a6632;color:rgba(255,255,255,.25)}

.confirm-password-wrapper{display:none;overflow:hidden}
.confirm-password-wrapper.expanded{display:block}
.confirm-password-wrapper .input-group{opacity:0;transform:translateY(-6px);transition:opacity .35s ease,transform .35s ease}
.confirm-password-wrapper.expanded .input-group{opacity:1;transform:translateY(0)}

.send-tip{font-size:.1rem;color:rgba(50,200,100,.85);text-align:center;margin-top:.04rem;opacity:0;transition:opacity .3s;pointer-events:none}
.send-tip.show{opacity:1}

.bottom-section{display:flex;flex-direction:column;align-items:center;width:100%;gap:.14rem;margin-top:.15rem;transform:translateY(-15%)}
.agreement-section{display:flex;align-items:center;gap:.08rem;width:100%;margin-top:0;justify-content:center}
.agreement-section .radio-btn{width:.09rem;height:.09rem;border:1.5px solid rgba(255,255,255,.35);border-radius:50%;cursor:pointer;flex-shrink:0;transition:all .2s;display:flex;align-items:center;justify-content:center;background:transparent;position:relative}
.agreement-section .radio-btn.checked{background:#32c864;border-color:#32c864}
.agreement-section .radio-btn.checked::after{content:'';width:.04rem;height:.04rem;background:#fff;border-radius:50%;position:absolute;top:50%;left:50%;transform:translate(-50%,-50%)}
.agreement-section label{font-size:.09rem;color:rgba(255,255,255,.35);line-height:1.5;cursor:pointer;user-select:none;font-style:italic;white-space:nowrap;font-weight:700}
.agreement-section label a{color:rgba(255,255,255,.55);text-decoration:underline;transition:color .2s}
.agreement-section label a:hover{color:#fff}

.next-btn{width:100%;height:.46rem;margin-top:.06rem;background:#32c864;border:none;border-radius:.08rem;color:#000;font-size:.17rem;font-weight:600;cursor:pointer;transition:all .3s;letter-spacing:.01em;box-shadow:0 .04rem .12rem rgba(0,0,0,.5)}
.next-btn:hover{box-shadow:0 .06rem .16rem rgba(0,0,0,.7)}
.next-btn:disabled{background:#1a6632;box-shadow:0 .02rem .06rem rgba(0,0,0,.3);color:rgba(255,255,255,.25);cursor:not-allowed}

.signin-link{margin-top:0;font-size:.13rem;color:rgba(255,255,255,.3);text-align:center}
.signin-link a{color:rgba(255,255,255,.55);transition:color .2s}
.signin-link a:hover{color:#fff}

.copyright{position:fixed;bottom:.1rem;left:.1rem;font-size:.09rem;color:rgba(255,255,255,.25);z-index:10}

.back-link{position:absolute;top:.3rem;left:.3rem;width:.36rem;height:.36rem;background:rgba(0,0,0,.75);border-radius:50%;display:flex;align-items:center;justify-content:center;box-shadow:0 .04rem .12rem rgba(0,0,0,.5);transition:background .2s,box-shadow .2s}
.back-link:hover{background:rgba(0,0,0,.9);box-shadow:0 .06rem .18rem rgba(0,0,0,.7)}
.back-link svg{width:.18rem;height:.18rem;color:#fff}

@media(max-width:768px){
    html{font-size:calc(100vw/3.75)}
    .signup-container{max-width:100%;padding:0 .4rem;height:100vh;padding-top:.2rem;padding-bottom:.2rem}
    .signup-logo{width:3rem;height:3rem}
    .signup-title{font-size:.4rem}
    .error-text{position:static;transform:none;padding-left:0;margin-top:.04rem;text-align:right;height:auto}
}
</style>
</head>
<body>

<a href="index.html#/" class="back-link">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
</a>

<div class="copyright">Copyright ©2026 VipenOnline All rights reserved</div>

<div class="comet-canvas" id="cometCanvas"></div>

<div class="signup-container">
    <div class="signup-header">
        <div class="signup-logo">
            <img src="images/vipen-logo.png" alt="Vipen">
        </div>
        <h1 class="signup-title">Membering</h1>
        <p class="signup-subtitle">Become a Vipen member</p>
    </div>

    <form class="signup-form" id="signupForm" autocomplete="off">
        <div class="input-group" id="accountGroup">
            <input type="text" id="accountName" class="input-field" placeholder="Account Name" autocomplete="off" maxlength="10">
            <div class="validation-icon" id="accountIcon">
                <svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="10" stroke="#32c864" stroke-width="2"/><path d="M8 12l2.5 2.5L16 9" stroke="#32c864" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </div>
            <span class="error-text" id="accountError">Only EN characters are supported</span>
        </div>

        <div class="input-group has-toggle" id="passwordGroup">
            <input type="password" id="password" class="input-field" placeholder="Password" autocomplete="new-password" maxlength="15">
            <button type="button" class="password-toggle" id="passwordToggle" tabindex="-1">
                <svg id="passwordEyeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
            <div class="validation-icon" id="passwordIcon">
                <svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="10" stroke="#32c864" stroke-width="2"/><path d="M8 12l2.5 2.5L16 9" stroke="#32c864" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </div>
        </div>

        <div class="confirm-password-wrapper" id="confirmPasswordWrapper">
            <div class="input-group has-toggle" id="confirmPasswordGroup">
                <input type="password" id="confirmPassword" class="input-field" placeholder="Confirm Password" autocomplete="new-password" maxlength="15">
                <button type="button" class="password-toggle" id="confirmPasswordToggle" tabindex="-1">
                    <svg id="confirmPasswordEyeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                </button>
                <div class="validation-icon" id="confirmPasswordIcon">
                    <svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="10" stroke="#32c864" stroke-width="2"/><path d="M8 12l2.5 2.5L16 9" stroke="#32c864" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
                </div>
            </div>
        </div>

        <div class="input-group" id="emailGroup">
            <input type="email" id="email" class="input-field" placeholder="Email" autocomplete="off">
            <div class="validation-icon" id="emailIcon">
                <svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="10" stroke="#32c864" stroke-width="2"/><path d="M8 12l2.5 2.5L16 9" stroke="#32c864" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </div>
        </div>

        <div class="input-group email-code-group" id="emailCodeGroup">
            <input type="text" id="emailCode" class="input-field" placeholder="Mail PIN" autocomplete="off" maxlength="6">
            <button type="button" class="send-code-btn" id="sendCodeBtn">Send Code</button>
        </div>

        <div class="send-tip" id="sendTip">Already Sent, Please Check</div>

        <div class="bottom-section">
            <div class="agreement-section">
                <div class="radio-btn" id="agreementRadio"></div>
                <label for="agreementCheckbox">I agree to follow VIPEN's membership rules &amp; <a href="rules.html" target="_blank">privacy regulations</a>.</label>
            </div>

            <button type="submit" class="next-btn" id="nextBtn" disabled>Next</button>

            <p class="signin-link">Already have an account? <a href="signin.html">Sign in</a></p>
        </div>
    </form>
</div>

<script>
(function(){
    var accountName = document.getElementById('accountName');
    var password = document.getElementById('password');
    var email = document.getElementById('email');
    var emailCode = document.getElementById('emailCode');
    var agreementCheckbox = document.getElementById('agreementCheckbox');
    var agreementRadio = document.getElementById('agreementRadio');
    var nextBtn = document.getElementById('nextBtn');
    var passwordToggle = document.getElementById('passwordToggle');
    var confirmPasswordWrapper = document.getElementById('confirmPasswordWrapper');
    var confirmPassword = document.getElementById('confirmPassword');
    var confirmPasswordToggle = document.getElementById('confirmPasswordToggle');
    var sendCodeBtn = document.getElementById('sendCodeBtn');
    var signupForm = document.getElementById('signupForm');
    var accountError = document.getElementById('accountError');
    var sendTip = document.getElementById('sendTip');

    var eyeOpenSvg = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>';
    var eyeClosedSvg = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>';

    function validateAccountName(value){
        if(!value) return false;
        if(value.length < 3 || value.length > 10) return false;
        return /^[a-zA-Z0-9]+$/.test(value);
    }

    function hasNonEnglishChars(value){
        if(!value) return false;
        return /[^a-zA-Z0-9]/.test(value);
    }

    function validatePassword(value){
        if(!value) return false;
        return value.length >= 8 && value.length <= 15;
    }

    function validateEmail(value){
        if(!value) return false;
        return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(value);
    }

    function validateEmailCode(value){
        return value && value.length === 6 && /^[0-9]+$/.test(value);
    }

    function showConfirmPassword(){
        confirmPasswordWrapper.style.display = 'block';
        requestAnimationFrame(function(){
            confirmPasswordWrapper.classList.add('expanded');
        });
    }

    function hideConfirmPassword(){
        confirmPasswordWrapper.classList.remove('expanded');
        confirmPassword.value = '';
        confirmPassword.classList.remove('valid','error');
        setValidationIcon('confirmPasswordIcon', false);
        setTimeout(function(){
            confirmPasswordWrapper.style.display = 'none';
        }, 350);
    }

    function setValidationIcon(iconId, isValid){
        var icon = document.getElementById(iconId);
        if(isValid){
            icon.classList.add('show');
        } else {
            icon.classList.remove('show');
        }
    }

    function setFieldError(inputEl, isError){
        if(isError){
            inputEl.classList.add('error');
            inputEl.classList.remove('valid');
        } else {
            inputEl.classList.remove('error');
        }
    }

    function clearFieldError(inputEl){
        inputEl.classList.remove('error');
    }

    function triggerShake(inputEl){
        inputEl.classList.remove('error');
        void inputEl.offsetWidth;
        inputEl.classList.add('error');
    }

    function updateNextButton(){
        var isAccountValid = validateAccountName(accountName.value);
        var isPasswordValid = validatePassword(password.value);
        var isEmailValid = validateEmail(email.value);
        var isCodeValid = validateEmailCode(emailCode.value);
        var isAgreed = agreementCheckbox.checked;

        var allValid = isAccountValid && isPasswordValid && isEmailValid && isCodeValid && isAgreed;

        if(confirmPasswordWrapper.classList.contains('expanded')){
            var isConfirmValid = confirmPassword.value && confirmPassword.value === password.value;
            if(!isConfirmValid) allValid = false;
        }

        if(allValid){
            nextBtn.disabled = false;
        } else {
            nextBtn.disabled = true;
        }
    }

    accountName.addEventListener('input', function(){
        var val = this.value;
        var isValid = validateAccountName(val);
        var hasInvalid = hasNonEnglishChars(val);
        setValidationIcon('accountIcon', isValid);
        if(isValid){
            this.classList.add('valid');
            clearFieldError(this);
        } else {
            this.classList.remove('valid');
        }
        if(hasInvalid){
            accountError.classList.add('show');
        } else {
            accountError.classList.remove('show');
        }
        updateNextButton();
    });

    accountName.addEventListener('blur', function(){
        var val = this.value;
        if(val && !validateAccountName(val)){
            triggerShake(this);
        }
    });

    password.addEventListener('input', function(){
        var isValid = validatePassword(this.value);
        setValidationIcon('passwordIcon', isValid);
        if(isValid){
            this.classList.add('valid');
            clearFieldError(this);
            if(!confirmPasswordWrapper.classList.contains('expanded')){
                showConfirmPassword();
            } else {
                setValidationIcon('confirmPasswordIcon', confirmPassword.value === this.value);
                if(confirmPassword.value !== this.value){
                    confirmPassword.classList.remove('valid');
                }
            }
        } else {
            this.classList.remove('valid');
            if(confirmPasswordWrapper.classList.contains('expanded')){
                hideConfirmPassword();
            }
        }
        updateNextButton();
    });

    password.addEventListener('blur', function(){
        var val = this.value;
        if(val && !validatePassword(val)){
            triggerShake(this);
        }
    });

    confirmPassword.addEventListener('input', function(){
        var isValid = this.value && this.value === password.value;
        setValidationIcon('confirmPasswordIcon', isValid);
        if(isValid){
            this.classList.add('valid');
            clearFieldError(this);
        } else {
            this.classList.remove('valid');
        }
        updateNextButton();
    });

    confirmPassword.addEventListener('blur', function(){
        var val = this.value;
        if(val && val !== password.value){
            triggerShake(this);
        }
    });

    confirmPasswordToggle.addEventListener('click', function(){
        var isPassword = confirmPassword.type === 'password';
        confirmPassword.type = isPassword ? 'text' : 'password';
        document.getElementById('confirmPasswordEyeIcon').innerHTML = isPassword ? eyeClosedSvg : eyeOpenSvg;
    });

    email.addEventListener('input', function(){
        var isValid = validateEmail(this.value);
        setValidationIcon('emailIcon', isValid);
        if(isValid){
            this.classList.add('valid');
            clearFieldError(this);
            sendCodeBtn.classList.add('active');
        } else {
            this.classList.remove('valid');
            sendCodeBtn.classList.remove('active');
        }
        if(sendTip.classList.contains('show')){
            sendTip.classList.remove('show');
        }
        updateNextButton();
    });

    email.addEventListener('blur', function(){
        var val = this.value;
        if(val && !validateEmail(val)){
            triggerShake(this);
        }
    });

    emailCode.addEventListener('input', function(){
        var isValid = validateEmailCode(this.value);
        if(isValid){
            this.classList.add('valid');
            clearFieldError(this);
        } else {
            this.classList.remove('valid');
        }
        updateNextButton();
    });

    emailCode.addEventListener('blur', function(){
        var val = this.value;
        if(val && !validateEmailCode(val)){
            triggerShake(this);
        }
    });

    agreementRadio.addEventListener('click', function(){
        var isChecked = agreementRadio.classList.toggle('checked');
        agreementCheckbox.checked = isChecked;
        updateNextButton();
    });

    passwordToggle.addEventListener('click', function(){
        var isPassword = password.type === 'password';
        password.type = isPassword ? 'text' : 'password';
        document.getElementById('passwordEyeIcon').innerHTML = isPassword ? eyeClosedSvg : eyeOpenSvg;
    });

    sendCodeBtn.addEventListener('click', function(){
        var emailVal = email.value;
        if(!validateEmail(emailVal)){
            alert('Please enter a valid email address first.');
            email.focus();
            return;
        }
        sendCodeBtn.disabled = true;
        sendTip.classList.add('show');
        var countdown = 60;
        sendCodeBtn.textContent = countdown + 's';
        var timer = setInterval(function(){
            countdown--;
            if(countdown <= 0){
                clearInterval(timer);
                sendCodeBtn.disabled = false;
                sendCodeBtn.textContent = 'Send Code';
                sendTip.classList.remove('show');
            } else {
                sendCodeBtn.textContent = countdown + 's';
            }
        }, 1000);
    });

    signupForm.addEventListener('submit', function(e){
        e.preventDefault();
        if(nextBtn.disabled) return;
        window.location.href = 'profile.html';
    });

    // ===== Comet Trail Effect =====
    (function(){
        var canvas = document.getElementById('cometCanvas');
        var isOverInteractive = false;
        var mouseX = -9999, mouseY = -9999;
        var prevMouseX = -9999, prevMouseY = -9999;
        var particles = [];
        var maxParticles = 40;
        var particleId = 0;

        var interactiveSelectors = '.signup-container, .back-link';

        function checkInteractiveTarget(e){
            var target = e.target;
            while(target && target !== document.body){
                if(target.matches && target.matches(interactiveSelectors)){
                    return true;
                }
                target = target.parentElement;
            }
            return false;
        }

        document.addEventListener('mousemove', function(e){
            prevMouseX = mouseX;
            prevMouseY = mouseY;
            mouseX = e.clientX;
            mouseY = e.clientY;
            isOverInteractive = checkInteractiveTarget(e);
        });

        document.addEventListener('mouseleave', function(){
            isOverInteractive = true;
        });

        function createParticle(x, y, speed){
            var el = document.createElement('div');
            el.className = 'comet-particle';
            var size = Math.random() * 3 + 2;
            el.style.width = size + 'px';
            el.style.height = size + 'px';
            el.style.left = '0px';
            el.style.top = '0px';

            var hue = Math.random() * 40 + 180;
            var color = 'hsla(' + hue + ', 80%, 70%, 1)';
            var glow = 'hsla(' + hue + ', 80%, 60%, 0.6)';
            el.style.background = color;
            el.style.boxShadow = '0 0 ' + (size * 2) + 'px ' + glow + ', 0 0 ' + (size * 4) + 'px ' + glow;

            canvas.appendChild(el);

            var angle = Math.atan2(mouseY - prevMouseY, mouseX - prevMouseX);
            var spread = (Math.random() - 0.5) * 0.6;
            var vx = Math.cos(angle + spread) * speed * 0.3;
            var vy = Math.sin(angle + spread) * speed * 0.3;

            var p = {
                id: particleId++,
                el: el,
                x: x,
                y: y,
                vx: vx,
                vy: vy,
                life: 1,
                decay: Math.random() * 0.015 + 0.012,
                scale: 1
            };

            gsap.set(el, { x: x, y: y, scale: 1, opacity: 1 });

            gsap.to(p, {
                life: 0,
                scale: 0,
                duration: 0.8 + Math.random() * 0.4,
                ease: 'power2.out',
                onUpdate: function(){
                    p.x += p.vx;
                    p.y += p.vy;
                    p.vx *= 0.96;
                    p.vy *= 0.96;
                    gsap.set(el, {
                        x: p.x,
                        y: p.y,
                        opacity: p.life,
                        scale: p.scale
                    });
                },
                onComplete: function(){
                    if(el.parentNode) el.parentNode.removeChild(el);
                    var idx = particles.indexOf(p);
                    if(idx > -1) particles.splice(idx, 1);
                }
            });

            particles.push(p);
        }

        function spawnHeadGlow(x, y){
            var el = document.createElement('div');
            el.className = 'comet-particle';
            var size = 6;
            el.style.width = size + 'px';
            el.style.height = size + 'px';
            el.style.left = '0px';
            el.style.top = '0px';
            el.style.background = 'radial-gradient(circle, rgba(200,230,255,0.9) 0%, rgba(150,200,255,0.4) 40%, transparent 70%)';
            el.style.boxShadow = '0 0 12px rgba(150,200,255,0.5), 0 0 24px rgba(100,180,255,0.3)';
            canvas.appendChild(el);

            gsap.set(el, { x: x - size/2, y: y - size/2, scale: 1, opacity: 0.8 });

            gsap.to(el, {
                opacity: 0,
                scale: 2,
                duration: 0.3,
                ease: 'power2.out',
                onComplete: function(){
                    if(el.parentNode) el.parentNode.removeChild(el);
                }
            });
        }

        var lastSpawnTime = 0;
        var spawnInterval = 16;

        function loop(timestamp){
            if(!isOverInteractive && mouseX > -9999 && prevMouseX > -9999){
                var dx = mouseX - prevMouseX;
                var dy = mouseY - prevMouseY;
                var dist = Math.sqrt(dx*dx + dy*dy);
                var speed = Math.min(dist, 30);

                if(dist > 1 && timestamp - lastSpawnTime > spawnInterval){
                    var count = Math.min(Math.floor(dist / 4), 3);
                    for(var i = 0; i < count; i++){
                        var t = i / count;
                        var px = prevMouseX + dx * t + (Math.random() - 0.5) * 4;
                        var py = prevMouseY + dy * t + (Math.random() - 0.5) * 4;
                        createParticle(px, py, speed);
                    }
                    spawnHeadGlow(mouseX, mouseY);
                    lastSpawnTime = timestamp;
                }
            }

            while(particles.length > maxParticles){
                var old = particles.shift();
                gsap.killTweensOf(old);
                if(old.el && old.el.parentNode) old.el.parentNode.removeChild(old.el);
            }

            requestAnimationFrame(loop);
        }

        requestAnimationFrame(loop);
    })();
})();
</script>
