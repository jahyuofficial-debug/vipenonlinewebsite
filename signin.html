<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=0, minimum-scale=1.0, maximum-scale=1.0">
<title>Sign In - Vipen</title>
<link rel="Shortcut Icon" href="images/favicon.png">
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="js/core/config.js"></script>
<script src="js/core/utils.js"></script>
<script src="js/core/comet-trail.js"></script>
<link rel="stylesheet" href="css/pages/signin.css">

</head>
<body>

<a href="index.html#/" class="back-link" id="backLink">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
</a>

<div class="copyright">Copyright ©2026 VipenOnline All rights reserved</div>

<div class="comet-canvas" id="cometCanvas"></div>

<div class="signin-container">
    <div class="signin-header">
        <div class="signin-logo">
            <img src="images/vipen-logo.png" alt="Vipen">
        </div>
        <h1 class="signin-title">Welcome Back</h1>
        <p class="signin-subtitle">Sign in with email verification</p>
    </div>

    <form class="signin-form" id="signinForm" autocomplete="off">
        <div class="input-group" id="emailGroup">
            <input type="email" id="email" class="input-field" placeholder="Email" autocomplete="off">
            <div class="validation-icon" id="emailIcon">
                <svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="10" stroke="#32c864" stroke-width="2"/><path d="M8 12l2.5 2.5L16 9" stroke="#32c864" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </div>
        </div>

        <div class="input-group email-code-group" id="emailCodeGroup">
            <input type="text" id="emailCode" class="input-field" placeholder="Verification Code" autocomplete="off" maxlength="6">
            <button type="button" class="send-code-btn" id="sendCodeBtn">Send Code</button>
        </div>

        <div class="send-tip" id="sendTip">Code sent, please check your inbox</div>

        <button type="submit" class="signin-btn" id="signinBtn" disabled>Sign In</button>

        <p class="signup-link">Don't have an account? <a href="signup.html">Sign up</a></p>
    </form>
</div>

<script src="js/pages/signin.js"></script>

<script src="anti-scrape.js"></script>

</body>
</html>
