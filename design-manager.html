<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Design Manager — Vipen</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#08080f;color:#fff;font-family:'Segoe UI',system-ui,sans-serif;min-height:100vh}
.wrap{max-width:900px;margin:0 auto;padding:24px}
h1{font-size:22px;margin-bottom:4px}.sub{font-size:12px;color:rgba(255,255,255,.3);margin-bottom:24px}

.toolbar{display:flex;gap:12px;margin-bottom:20px;flex-wrap:wrap}
.toolbar button,.toolbar .btn{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);color:#fff;padding:8px 18px;border-radius:8px;cursor:pointer;font-size:13px;transition:all .2s}
.toolbar button:hover,.toolbar .btn:hover{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.25)}
.toolbar .btn-primary{background:#d4a853;color:#000;border-color:#d4a853}
.toolbar .btn-primary:hover{background:#e0b960}

.project-card{background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.06);border-radius:12px;padding:20px;margin-bottom:16px}
.project-card h3{font-size:16px;margin-bottom:16px;display:flex;align-items:center;gap:10px}
.project-card h3 input{flex:1;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);color:#fff;padding:6px 10px;border-radius:6px;font-size:15px}
.project-card h3 .idx{font-size:11px;color:rgba(255,255,255,.2);min-width:50px}

.fields{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
.field{display:flex;flex-direction:column}
.field label{font-size:10px;color:rgba(255,255,255,.3);text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px}
.field input,.field textarea{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);border-radius:6px;color:#fff;padding:8px 10px;font-size:12px;font-family:inherit;outline:none;transition:border .2s}
.field input:focus,.field textarea:focus{border-color:#d4a853}
.field textarea{resize:vertical;min-height:50px}
.field.full{grid-column:1/-1}

.section-label{font-size:10px;color:rgba(255,255,255,.25);text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px;margin-top:16px}

/* Main images */
.main-imgs{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.main-img-slot{width:100px;position:relative}
.main-img-slot .slot-label{font-size:9px;color:rgba(255,255,255,.25);margin-bottom:4px;text-align:center}
.main-img-slot .slot-img{width:100px;height:75px;border-radius:6px;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.06);object-fit:cover;display:block;cursor:pointer;transition:border .2s}
.main-img-slot .slot-img:hover{border-color:rgba(255,255,255,.2)}
.main-img-slot input{display:none}

/* Content images - sortable */
.content-imgs{display:flex;flex-wrap:wrap;gap:8px;min-height:60px;padding:8px;border:1px dashed rgba(255,255,255,.06);border-radius:8px;background:rgba(255,255,255,.01)}
.content-img-slot{width:80px;position:relative;cursor:grab;transition:transform .15s,box-shadow .15s}
.content-img-slot:active{cursor:grabbing}
.content-img-slot.drag-over{transform:scale(1.05);box-shadow:0 0 0 2px #d4a853}
.content-img-slot img{width:80px;height:60px;border-radius:4px;object-fit:cover;border:1px solid rgba(255,255,255,.08);pointer-events:none}
.content-img-slot .idx-badge{position:absolute;top:2px;left:2px;background:rgba(0,0,0,.7);color:rgba(255,255,255,.6);font-size:9px;padding:1px 5px;border-radius:3px}
.content-img-slot .remove-btn{position:absolute;top:2px;right:2px;width:16px;height:16px;border-radius:50%;background:rgba(239,68,68,.7);color:#fff;font-size:9px;line-height:16px;text-align:center;cursor:pointer;display:none}
.content-img-slot:hover .remove-btn{display:block}
.content-img-slot .replace-btn{position:absolute;bottom:2px;right:2px;width:16px;height:16px;border-radius:50%;background:rgba(212,168,83,.7);color:#000;font-size:9px;line-height:16px;text-align:center;cursor:pointer;display:none}
.content-img-slot:hover .replace-btn{display:block}
.content-img-slot input{display:none}
.add-img-btn{width:80px;height:60px;border:1px dashed rgba(255,255,255,.1);border-radius:4px;display:flex;align-items:center;just-content:center;cursor:pointer;color:rgba(255,255,255,.15);font-size:20px;transition:all .2s}
.add-img-btn:hover{border-color:rgba(255,255,255,.3);color:rgba(255,255,255,.4)}

.status{position:fixed;bottom:20px;right:20px;padding:10px 20px;border-radius:8px;font-size:13px;z-index:999;opacity:0;transform:translateY(10px);transition:all .3s}
.status.show{opacity:1;transform:translateY(0)}
.status.ok{background:rgba(34,197,94,.9);color:#fff}
.status.err{background:rgba(239,68,68,.9);color:#fff}

.collapse-btn{font-size:11px;color:rgba(212,168,83,.7);cursor:pointer;background:none;border:none;margin-left:8px}

.url-preview{font-size:10px;color:rgba(255,255,255,.2);word-break:break-all;margin-top:2px;display:none}
.main-img-slot:hover .url-preview{display:block}
</style>
</head>
<body>
<div class="wrap">
  <h1>Design Manager</h1>
  <p class="sub">Edit, reorder & manage published design projects</p>

  <div class="toolbar">
    <button id="loadLiveBtn" class="btn-primary">Load from vipenonline.com</button>
    <button id="loadLocalBtn">Load local JSON</button>
    <button id="downloadBtn" style="display:none">Download updated JSON</button>
    <button id="saveBtn" class="btn-primary" style="display:none">Save & Commit</button>
    <span style="font-size:11px;color:rgba(255,255,255,.2);display:flex;align-items:center;margin-left:8px" id="projectCount"></span>
  </div>

  <div id="projects"></div>
  <div class="status" id="status"></div>
</div>

<script>
var projects = [];
var imageReplacements = {}; // { projectIndex: { imageIndex: file } }

function showStatus(msg, type) {
    var s = document.getElementById('status');
    s.textContent = msg;
    s.className = 'status show ' + (type || 'ok');
    setTimeout(function(){ s.classList.remove('show'); }, 3000);
}

// ── Load ──────────────────────────────────────────────
document.getElementById('loadLiveBtn').addEventListener('click', function() {
    fetch('https://vipenonline.com/design/index.json?' + Date.now())
        .then(function(r) { return r.json(); })
        .then(function(data) {
            projects = data;
            renderAll();
            showStatus('Loaded ' + projects.length + ' projects from live site');
        })
        .catch(function() { showStatus('Failed to load from live site', 'err'); });
});

document.getElementById('loadLocalBtn').addEventListener('click', function() {
    var input = document.createElement('input');
    input.type = 'file';
    input.accept = '.json';
    input.addEventListener('change', function() {
        var reader = new FileReader();
        reader.onload = function(e) {
            try { projects = JSON.parse(e.target.result); renderAll(); showStatus('Loaded local JSON'); }
            catch(ex) { showStatus('Invalid JSON', 'err'); }
        };
        reader.readAsText(input.files[0]);
    });
    input.click();
});

// ── Render ─────────────────────────────────────────────
function renderAll() {
    var container = document.getElementById('projects');
    document.getElementById('projectCount').textContent = projects.length + ' projects';
    document.getElementById('downloadBtn').style.display = '';
    document.getElementById('saveBtn').style.display = '';

    var html = '';
    projects.forEach(function(proj, pi) {
        html += buildProjectCard(proj, pi);
    });
    container.innerHTML = html;

    // Bind events after render
    projects.forEach(function(proj, pi) {
        bindCardEvents(pi);
    });
}

function buildProjectCard(proj, pi) {
    var coverBg = proj.cardBg ? 'url(' + proj.cardBg + ') center/cover' : '#111';
    return '<div class="project-card" data-pi="' + pi + '">' +
        '<h3><span class="idx">#' + (pi+1) + '</span>' +
        '<input value="' + esc(proj.title || '') + '" data-field="title" data-pi="' + pi + '" placeholder="Title">' +
        '</h3>' +
        '<div class="fields">' +
        '<div class="field full"><label>Description</label><textarea data-field="description" data-pi="' + pi + '" placeholder="Description">' + esc(proj.description || '') + '</textarea></div>' +
        '<div class="field"><label>Client</label><input value="' + esc(proj.client || '') + '" data-field="client" data-pi="' + pi + '">' +
        '<div class="field"><label>Published</label><input value="' + esc(proj.published || '') + '" data-field="published" data-pi="' + pi + '">' +
        '<div class="field"><label>Tools</label><input value="' + esc(proj.tools || '') + '" data-field="tools" data-pi="' + pi + '">' +
        '<div class="field"><label>Folder</label><input value="' + esc(proj.folder || '') + '" data-field="folder" data-pi="' + pi + '">' +
        '<div class="field"><label>Tags (comma)</label><input value="' + esc((proj.tags||[]).join(', ')) + '" data-field="tags" data-pi="' + pi + '">' +
        '<div class="field"><label>Spacing</label><select data-field="spacing" data-pi="' + pi + '">' +
        '<option value="small"' + (proj.spacing==='small'?' selected':'') + '>Small</option>' +
        '<option value="medium"' + (proj.spacing==='medium'?' selected':'') + '>Medium</option>' +
        '<option value="large"' + (proj.spacing==='large'?' selected':'') + '>Large</option></select></div>' +
        '<div class="field"><label>Desc Position</label><select data-field="descPosition" data-pi="' + pi + '">' +
        '<option value="top"' + (proj.descPosition==='top'?' selected':'') + '>Top</option>' +
        '<option value="bottom"' + (proj.descPosition==='bottom'?' selected':'') + '>Bottom</option></select></div>' +
        '</div>' +

        // Main images
        '<div class="section-label">Main Images — click to replace</div>' +
        '<div class="main-imgs">' +
        buildMainImgSlot('card-bg', 'Card Cover', proj.cardBg, pi) +
        buildMainImgSlot('card-hover', 'Card Hover', proj.cardHoverBg, pi) +
        buildMainImgSlot('header-bg', 'Header BG', proj.headerBg, pi) +
        '</div>' +

        // Content images — sortable
        '<div class="section-label">Content Images — drag to reorder | click to replace</div>' +
        '<div class="content-imgs" data-pi="' + pi + '" id="contentImgs-' + pi + '">' +
        buildContentImgSlots(proj.contentImages || [], pi) +
        '</div>' +
        '</div>';
}

function buildMainImgSlot(key, label, url, pi) {
    return '<div class="main-img-slot">' +
        '<div class="slot-label">' + label + '</div>' +
        '<img class="slot-img" src="' + (url || '') + '" alt="" title="Click to replace" ' + (url ? '' : 'style="background:#222"') + '>' +
        '<input type="file" accept="image/*" data-main-img="' + key + '" data-pi="' + pi + '">' +
        (url ? '<div class="url-preview">' + url + '</div>' : '') +
        '</div>';
}

function buildContentImgSlots(images, pi) {
    var h = '';
    images.forEach(function(url, ci) {
        h += '<div class="content-img-slot" draggable="true" data-pi="' + pi + '" data-ci="' + ci + '">' +
            '<span class="idx-badge">' + (ci+1) + '</span>' +
            '<img src="' + url + '" alt="">' +
            '<div class="remove-btn" title="Remove">✕</div>' +
            '<div class="replace-btn" title="Replace">↻</div>' +
            '<input type="file" accept="image/*" data-pi="' + pi + '" data-ci="' + ci + '">' +
            '</div>';
    });
    h += '<div class="add-img-btn" data-pi="' + pi + '" title="Add image">+</div>';
    return h;
}

function esc(s) {
    if (!s) return '';
    return s.replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// ── Bind events ─────────────────────────────────────────
function bindCardEvents(pi) {
    // Text field changes
    document.querySelectorAll('[data-pi="' + pi + '"][data-field]').forEach(function(el) {
        el.addEventListener('change', function() {
            var field = el.getAttribute('data-field');
            var val = el.value;
            if (field === 'tags') {
                projects[pi].tags = val.split(',').map(function(s){return s.trim();}).filter(Boolean);
            } else {
                projects[pi][field] = val;
            }
        });
    });

    // Main image replacement
    document.querySelectorAll('input[data-main-img][data-pi="' + pi + '"]').forEach(function(inp) {
        inp.addEventListener('change', function() {
            if (!inp.files.length) return;
            var key = inp.getAttribute('data-main-img');
            var reader = new FileReader();
            reader.onload = function(e) {
                projects[pi][key] = e.target.result; // base64 for preview
                var img = inp.parentNode.querySelector('.slot-img');
                if (img) img.src = e.target.result;
            };
            reader.readAsDataURL(inp.files[0]);
        });
    });
    document.querySelectorAll('.main-img-slot .slot-img').forEach(function(img) {
        img.addEventListener('click', function() {
            img.parentNode.querySelector('input').click();
        });
    });

    // Content image: drag & drop
    var container = document.getElementById('contentImgs-' + pi);
    if (!container) return;
    bindDragDrop(container, pi);

    // Content image: replace
    container.querySelectorAll('input[type="file"]').forEach(function(inp) {
        inp.addEventListener('change', function() {
            if (!inp.files.length) return;
            var ci = parseInt(inp.getAttribute('data-ci'));
            var reader = new FileReader();
            reader.onload = function(e) {
                projects[pi].contentImages[ci] = e.target.result;
                renderAll();
            };
            reader.readAsDataURL(inp.files[0]);
        });
    });

    // Content image: click to replace
    container.querySelectorAll('.content-img-slot img').forEach(function(img) {
        img.addEventListener('click', function(e) {
            e.stopPropagation();
            var slot = img.parentNode;
            slot.querySelector('.replace-btn').click();
        });
    });
    container.querySelectorAll('.replace-btn').forEach(function(btn) {
        btn.addEventListener('click', function(e) {
            e.stopPropagation();
            btn.parentNode.querySelector('input').click();
        });
    });

    // Content image: remove
    container.querySelectorAll('.remove-btn').forEach(function(btn) {
        btn.addEventListener('click', function(e) {
            e.stopPropagation();
            var ci = parseInt(btn.parentNode.getAttribute('data-ci'));
            projects[pi].contentImages.splice(ci, 1);
            renderAll();
        });
    });

    // Add image button
    var addBtn = container.querySelector('.add-img-btn');
    if (addBtn) {
        addBtn.addEventListener('click', function() {
            var url = prompt('Enter image URL (or leave blank to cancel):');
            if (url && url.trim()) {
                projects[pi].contentImages.push(url.trim());
                renderAll();
            }
        });
    }
}

// ── Drag & drop ─────────────────────────────────────────
function bindDragDrop(container, pi) {
    var slots = container.querySelectorAll('.content-img-slot');
    var draggedIdx = null;

    slots.forEach(function(slot) {
        slot.addEventListener('dragstart', function(e) {
            draggedIdx = parseInt(slot.getAttribute('data-ci'));
            slot.style.opacity = '0.5';
            e.dataTransfer.effectAllowed = 'move';
        });
        slot.addEventListener('dragend', function() {
            slot.style.opacity = '1';
            container.querySelectorAll('.content-img-slot').forEach(function(s){s.classList.remove('drag-over');});
            draggedIdx = null;
        });
        slot.addEventListener('dragover', function(e) {
            e.preventDefault();
            e.dataTransfer.dropEffect = 'move';
            slot.classList.add('drag-over');
        });
        slot.addEventListener('dragleave', function() {
            slot.classList.remove('drag-over');
        });
        slot.addEventListener('drop', function(e) {
            e.preventDefault();
            slot.classList.remove('drag-over');
            var dropIdx = parseInt(slot.getAttribute('data-ci'));
            if (draggedIdx !== null && draggedIdx !== dropIdx) {
                var arr = projects[pi].contentImages;
                var item = arr.splice(draggedIdx, 1)[0];
                arr.splice(dropIdx, 0, item);
                renderAll();
            }
        });
    });
}

// ── Download ────────────────────────────────────────────
document.getElementById('downloadBtn').addEventListener('click', function() {
    var json = JSON.stringify(projects, null, 2);
    var blob = new Blob([json], { type: 'application/json' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = 'design-index.json';
    a.click();
    URL.revokeObjectURL(url);
    showStatus('JSON downloaded — replace design/index.json and deploy');
});

// ── Save ────────────────────────────────────────────────
document.getElementById('saveBtn').addEventListener('click', function() {
    var json = JSON.stringify(projects, null, 2);
    var blob = new Blob([json], { type: 'application/json' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = 'design-index.json';
    a.click();
    URL.revokeObjectURL(url);
    showStatus('Downloaded! Replace design/index.json in your repo, commit & push to deploy.');
});
</script>
</body>
</html>
